<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",
authDomain:"grand-line-rpg-dcda9.firebaseapp.com",
projectId:"grand-line-rpg-dcda9",
storageBucket:"grand-line-rpg-dcda9.appspot.com",
messagingSenderId:"172042779786",
appId:"1:172042779786:web:ecdff9eaf4fee36eca8173",
databaseURL:"https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const tiersImg={
1:"https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-1.png",
2:"https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-2.png",
3:"https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-3.png",
4:"https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-4.png",
5:"https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-5.png"
};

const list=document.getElementById("list");
let styles=[];

async function carregarRacas(){

const snap=await get(ref(db,"itens/Fator de Linhagem"));

if(!snap.exists())return;

const data=snap.val();

styles=Object.keys(data).map(key=>{

const raca=data[key];

return{
n:key,
t:Number(raca.tier),
d:raca["description-alter"],
img:raca["img-alter"]
};

});

renderizar();

}

function renderizar(){

list.innerHTML="";

for(let t=1;t<=5;t++){

const sep=document.createElement("div");
sep.className="tier-sep";
sep.innerHTML=`<img src="${tiersImg[t]}">`;
list.appendChild(sep);

styles.filter(s=>s.t===t).forEach(s=>{

const item=document.createElement("div");
item.className="item";

item.innerHTML=`
<img src="https://res.cloudinary.com/djh45admn/image/upload/v1779847983/${s.img}.jpg">
<span>${s.n}</span>
`;

item.onclick=()=>openModal(s);

list.appendChild(item);

});

}

}

function openModal(s){

document.getElementById("modal").style.display="flex";

document.getElementById("m-title").innerText=s.n;

document.getElementById("m-tier-img").src=tiersImg[s.t];

document.getElementById("m-desc").innerText=s.d;

document.getElementById("m-img").src=
"https://res.cloudinary.com/djh45admn/image/upload/v1779847983/"+s.img+".jpg";

document.getElementById("m-btn").onclick=()=>{

abrirHabilidades(s.n);

};

}

window.closeModal=function(){
document.getElementById("modal").style.display="none";
}

window.closeHabilidades=function(){

document.getElementById("habilidades-container").innerHTML="";

const modal=document.getElementById("habilidades-modal");

if(modal)modal.style.display="none";

}

window.voltar=function(){
history.back();
}

carregarRacas();

</script>
