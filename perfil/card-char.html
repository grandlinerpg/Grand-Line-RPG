<div id="personagem-modal" class="card-modal">

  <div class="card-window personagem-window">


    <button id="close-personagem" class="close-card">
      ×
    </button>


    <div class="personagem-image-area">


      <img 
      id="personagem-img" 
      class="personagem-img"
      src="default-personagem.png">



      <!-- NOME EM CIMA -->
      <h2 id="personagem-nome" class="card-nome">
        -
      </h2>




      <!-- PARTE INFERIOR IGUAL CARD -->

      <div class="card-bottom">



        <!-- ATRIBUTOS ESQUERDA -->

        <div class="card-atributos">

          <div id="personagem-str">
            STR -
          </div>


          <div id="personagem-res">
            RES -
          </div>


          <div id="personagem-dex">
            DEX -
          </div>


          <div id="personagem-agi">
            AGI -
          </div>


          <div id="personagem-sta">
            STA -
          </div>


          <div id="personagem-hp">
            HP -
          </div>


        </div>





        <!-- RANK DIREITA -->

        <div 
        id="personagem-rank" 
        class="card-rank">

          -

        </div>



      </div>


    </div>





    <!-- UPLOAD -->

    <label class="upload-personagem">

      UPLOAD

      <input 
      type="file" 
      id="upload-img"
      accept="image/*"
      hidden>

    </label>





    <!-- DOWNLOAD -->

    <button 
    id="download-personagem" 
    class="download-card">

      DOWNLOAD

    </button>



  </div>


</div>
