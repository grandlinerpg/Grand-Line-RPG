<!-- MODAL DE VENDA -->
<div id="sell-modal" class="item-modal">

  <div class="item-window">

    <div class="item-info">
      <h2>ANUNCIAR ITEM</h2>
    </div>

    <div class="item-top">

      <div id="sell-item-image" class="item-emoji">
        📦
      </div>

      <div class="item-info">

        <p id="sell-item-name" class="sell-item-name">
          Nome do Item
        </p>
        
        <p id="sell-min-price" class="sell-min-price">
          Faixa de preço: ฿ 0 até ฿ 0
        </p>

      </div>

    </div>

    <!-- INPUTS -->
    <input
      id="sell-price-input"
      type="text"
      placeholder="Digite o valor do anúncio"
    />

    <select id="sell-qty-input"></select>
    
    <!-- BOTÕES -->
    <div class="item-actions">

      <button id="confirm-sell">
        ANUNCIAR
      </button>

      <button id="cancel-sell">
        CANCELAR
      </button>

    </div>

  </div>

</div>


<!-- MODAL DE MENSAGEM -->
<div id="message-modal" class="item-modal">

  <div class="item-window">

    <div class="item-top">

      <div class="item-info">

        <div class="item-info">
          <h2 id="message-title">MENSAGEM!</h2>
        </div>

        <p id="message-text">
          Mensagem
        </p>

      </div>

    </div>

    <div class="item-actions">

      <button id="message-ok">
        OK
      </button>

    </div>

  </div>

</div>
