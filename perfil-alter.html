<div id="perfil-alter-modal" class="modal">

  <div class="modal-box">

    <span id="close-perfil-alter" class="close">×</span>

    <img id="alter-img" class="modal-img">

    <h2 id="alter-charname"></h2>

    <p id="alter-nome"></p>

    <div class="modal-level-badge" id="alter-level">
      1
    </div>

    <div class="modal-stats">

      <div class="jog-stat-box">
        <span>EXP</span>
        <strong id="alter-exp"></strong>
      </div>

      <div class="jog-stat-box">
        <span>SALDO</span>
        <strong id="alter-saldo"></strong>
      </div>

    </div>

  </div>

</div>
