<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combate - Grand Line RPG</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="combate.css">
</head>

<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="arena">

    <!-- PLAYER 1 -->
    <div class="player" id="player1">
      <div class="avatar">
        <img src="https://i.imgur.com/8Km9tLL.png" id="p1-img">
      </div>
      <div class="name" id="p1-name">Jogador 1</div>

      <div class="hp-bar">
        <div class="hp-fill" id="p1-hp"></div>
      </div>

      <div class="hp-text" id="p1-hp-text">100 / 100</div>
    </div>

    <div class="vs">VS</div>

    <!-- PLAYER 2 -->
    <div class="player" id="player2">
      <div class="avatar">
        <img src="https://i.imgur.com/3ZQ3ZQ9.png" id="p2-img">
      </div>
      <div class="name" id="p2-name">Adversário</div>

      <div class="hp-bar">
        <div class="hp-fill" id="p2-hp"></div>
      </div>

      <div class="hp-text" id="p2-hp-text">100 / 100</div>
    </div>

  </div>

  <!-- AÇÕES -->
  <div class="actions">
    <button onclick="atacar()">ATACAR</button>
    <button onclick="defender()">DEFENDER</button>
    <button onclick="skill()">SKILL</button>
  </div>

  <script src="combate.js"></script>

</body>

</html>
