<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facções - Grand Line RPG</title>

  <link rel="stylesheet" href="faccoes.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <header class="navbar">

    <div class="logo-area">
      <img src="https://i.imgur.com/aBJrsQt.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <nav>
      <a href="#" id="voltarBtn">INÍCIO</a>
      <a href="faccoes.html">FACÇÕES</a>
      <a href="mapa.html">MAPA</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <section class="guide-title">
    <h1>FACÇÕES DO MUNDO</h1>
    <p>Escolha seu lado no mundo de Grand Line.</p>
  </section>

  <main class="faccao-container">

    <!-- GOVERNO -->
    <div class="faccao-card governo">

      <div class="faccao-banner">
        <img src="https://res.cloudinary.com/djh45admn/image/upload/v1778450635/Governo_Mundial.IMAGEM.093555_tgzieg.jpg">
      </div>

      <div class="faccao-content">

        <h2>Governo Mundial</h2>

        <p class="descricao">
          A maior autoridade dos mares.
        </p>

        <div class="buttons">

          <button onclick="go('faccoes/governo.html')">
            ENTRAR
          </button>

          <button class="secondary"
            onclick="openMembers('governo')">
            VER MEMBROS
          </button>

        </div>

      </div>

    </div>

    <!-- REVOLUCIONÁRIOS -->
    <div class="faccao-card revolucionario">

      <div class="faccao-banner">
        <img src="https://res.cloudinary.com/djh45admn/image/upload/v1778450634/Ex%C3%A9rcito_Revolucion%C3%A1rio.IMAGEM.093650_owlnwb.jpg">
      </div>

      <div class="faccao-content">

        <h2>Exército Revolucionário</h2>

        <div class="buttons">

          <button onclick="go('faccoes/revolucionario.html')">
            ENTRAR
          </button>

          <button class="secondary"
            onclick="openMembers('revolucionario')">
            VER MEMBROS
          </button>

        </div>

      </div>

    </div>

    <!-- PIRATAS -->
    <div class="faccao-card piratas">

      <div class="faccao-banner">
        <img src="https://res.cloudinary.com/djh45admn/image/upload/v1778450634/CHAP%C3%89US_DE_PALHA.IMAGEM.161956_qitqkk.jpg">
      </div>

      <div class="faccao-content">

        <h2>Piratas</h2>

        <div class="buttons">

          <button onclick="go('faccoes/piratas.html')">
            ENTRAR
          </button>

          <button class="secondary"
            onclick="openMembers('piratas')">
            VER MEMBROS
          </button>

        </div>

      </div>

    </div>

  </main>

  <!-- 🪟 MODAL DOS MEMBROS -->
  <div id="modal-container"></div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4kgy_L79WYFQr9XZhoDuZBfqG4AGTVUQ",
      authDomain: "grand-line-rpg-dcda9.firebaseapp.com",
      projectId: "grand-line-rpg-dcda9",
      databaseURL: "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function go(page) {
      window.location.href = page;
    }

    window.go = go;

    // ======================
    // LOGIN CHECK
    // ======================
    const voltarBtn = document.getElementById("voltarBtn");

    onAuthStateChanged(auth, (user) => {

      if (user) {
        voltarBtn.textContent = "PERFIL";
        voltarBtn.href = "perfil.html";
      } else {
        voltarBtn.textContent = "INÍCIO";
        voltarBtn.href = "index.html";
      }

    });

    // ======================
    // ABRIR MODAL (IMPORTANTE)
    // ======================
    window.openMembers = function (faccao) {

      fetch("perfil/membros.html")
        .then(res => res.text())
        .then(html => {

          document.getElementById("modal-container").innerHTML = html;

          const modal = document.querySelector(".members-modal");

          modal.style.display = "flex";

          const script = document.createElement("script");
          script.type = "module";
          script.src = "perfil/membros.js";
          document.body.appendChild(script);

          // passa filtro depois de carregar script
          setTimeout(() => {
            if (window.openMembers) {
              window.openMembers(faccao);
            }
          }, 200);

        });

    };

  </script>

</body>

</html>
