<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line RPG - Login</title>

  <link rel="stylesheet" href="auth.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- CONTAINER PARA RECAPTCHA INVISÍVEL DO FIREBASE -->
  <div id="recaptcha-container"></div>

  <!-- CONTAINER -->
  <main class="auth-container">

    <!-- LOGIN -->
    <div class="auth-card" id="login-box">

      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo"
      >

      <h1>GRAND LINE RPG</h1>

      <p>
        Entre na sua conta para continuar sua jornada.
      </p>

      <form>

        <div class="input-group">

          <label>Celular (com DDD)</label>

          <input
            type="tel"
            id="login-phone"
            placeholder="Ex: 16999998888"
          >

        </div>

        <div class="input-group">

          <label>Senha</label>

          <input
            type="password"
            id="login-password"
            placeholder="Digite sua senha"
          >

        </div>

        <button
          type="button"
          onclick="login()"
        >
          ENTRAR
        </button>

      </form>

      <div class="switch-page">

        <span>Não possui conta?</span>

        <button
          class="switch-btn"
          onclick="showRegister()"
        >
          REGISTRAR
        </button>

      </div>

    </div>

    <!-- REGISTRO -->
    <div
      class="auth-card hidden"
      id="register-box"
    >

      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo"
      >

      <h1>CRIAR CONTA</h1>

      <p>
        Verifique seu celular via SMS para criar sua conta.
      </p>

      <form>

        <div class="input-group">

          <label>Nome</label>

          <input
            type="text"
            id="register-name"
            placeholder="Digite seu nome"
          >

        </div>

        <div class="input-group">

          <label>Celular (com DDD)</label>

          <input
            type="tel"
            id="register-phone"
            placeholder="Ex: 16999998888"
          >

        </div>

        <!-- CAMPO DE SMS DO CADASTRO (INICIALMENTE OCULTO) -->
        <div class="input-group hidden" id="sms-group">

          <label>Código SMS (6 dígitos)</label>

          <input
            type="text"
            id="register-sms-code"
            placeholder="Digite o código enviado por SMS"
          >

        </div>

        <div class="input-group">

          <label>Senha</label>

          <input
            type="password"
            id="register-password"
            placeholder="Digite sua senha"
          >

        </div>

        <div class="input-group">

          <label>Confirmar Senha</label>

          <input
            type="password"
            id="register-confirm"
            placeholder="Confirme sua senha"
          >

        </div>

        <!-- BOTAO DE ENVIAR SMS -->
        <button
          type="button"
          id="btn-send-sms"
          onclick="sendRegisterSMS()"
        >
          ENVIAR CÓDIGO SMS
        </button>

        <!-- BOTAO FINAL DE REGISTRO (APÓS SMS) -->
        <button
          type="button"
          id="btn-confirm-register"
          class="hidden"
          onclick="register()"
        >
          VALIDAR CÓDIGO E CRIAR CONTA
        </button>

      </form>

      <div class="switch-page">

        <span>Já possui conta?</span>

        <button
          class="switch-btn"
          onclick="showLogin()"
        >
          LOGIN
        </button>

      </div>

    </div>

  </main>

  <script>

    function showRegister(){

      document
        .getElementById("login-box")
        .classList.add("hidden");

      document
        .getElementById("register-box")
        .classList.remove("hidden");
    }

    function showLogin(){

      document
        .getElementById("register-box")
        .classList.add("hidden");

      document
        .getElementById("login-box")
        .classList.remove("hidden");
    }

  </script>

  <script type="module" src="firebase.js"></script>

</body>
</html>
