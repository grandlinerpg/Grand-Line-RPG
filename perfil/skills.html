<div id="skills-modal" class="skills-modal">

  <div class="skills-window">

    <button id="close-skills" class="close-skills">×</button>

    <div class="skills-header">
      <h2>HABILIDADES</h2>
    </div>

    <!-- PONTOS + ÁRVORE -->
    <div class="skills-top">

      <div class="skills-points">

        <div>
          Disponíveis
          <span id="skill-available">0</span>
        </div>

        <button
          id="open-skill-tree"
          class="skill-tree-btn"
          title="Árvore de Habilidades"
        >
          <img 
            src="https://res.cloudinary.com/djh45admn/image/upload/v1778432202/livro.png"
            class="skill-tree-img"
          >
        </button>

        <div>
          Usados
          <span id="skill-used">0</span>
        </div>

      </div>

    </div>

    <div class="skills-divider"></div>
    
    <!-- FILTRO -->
    <div class="skills-filter">
      <select id="skills-category">
        <option value="all">Todas Categorias</option>
      </select>
    </div>

    <!-- LISTA -->
    <div id="skills-list" class="skills-list"></div>

  </div>

</div>
