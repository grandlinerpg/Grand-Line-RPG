<!-- MODAL DISTRIBUIR PONTOS -->
<div class="points-modal">

  <div class="points-window">

    <!-- TOPO -->
    <div class="window-top">

      <h1>DISTRIBUIR PONTOS</h1>

      <button class="close-btn">
        ✕
      </button>

    </div>

    <!-- ATRIBUTOS -->
    <div class="points-list">

      <div class="point-row">
        <span>💪 Força</span>

        <div class="point-controls">
          <span id="str-value">0</span>

          <button class="plus-btn">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>🛡 Resistência</span>

        <div class="point-controls">
          <span id="res-value">0</span>

          <button class="plus-btn">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>🎯 Destreza</span>

        <div class="point-controls">
          <span id="dex-value">0</span>

          <button class="plus-btn">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>⚡ Agilidade</span>

        <div class="point-controls">
          <span id="agi-value">0</span>

          <button class="plus-btn">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>🔥 Stamina</span>

        <div class="point-controls">
          <span id="sta-value">0</span>

          <button class="plus-btn">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>❤️ Vida</span>

        <div class="point-controls">
          <span id="hp-value">0</span>

          <button class="plus-btn">+</button>
        </div>
      </div>

    </div>

    <!-- RODAPÉ -->
    <div class="points-footer">

      <div class="footer-box">
        <p>PONTOS DISTRIBUÍDOS</p>
        <span id="used-points">0</span>
      </div>

      <div class="footer-box">
        <p>PONTOS DISPONÍVEIS</p>
        <span id="available-points">10</span>
      </div>

    </div>

    <!-- BOTÃO -->
    <button class="save-btn">
      CONFIRMAR
    </button>

  </div>

</div>
