<div id="efeito-edit" class="ficha-edit-modal">


<div class="ficha-edit-window">


<button id="close-efeito-edit" class="close-ficha-edit">
    ×
</button>


<h2>
EDITAR EFEITO
</h2>



<div class="ficha-edit-scroll">


<div class="img-upload-area">


    <div class="img-box">

        <img id="efeito-edit-img" class="edit-img">

    </div>


    <button id="upload-efeito-img-btn" class="upload-img-btn">
        📤
    </button>


    <input 
    type="file" 
    id="upload-efeito-img-input" 
    accept="image/*"
    hidden>


</div>



<label>
Nome
</label>

<input id="efeito-edit-nome">





<label>
Descrição
</label>

<textarea id="efeito-edit-description"></textarea>





<label>
Funcionamento
</label>

<textarea id="efeito-edit-funcionamento"></textarea>





<label>
Extras
</label>

<div id="extras-edit-area" class="efeitos-edit-area">

</div>

<button
id="add-extra-edit"
class="add-efeito-edit"
type="button">
+
</button>



</div>




<button id="salvar-efeito-edit" class="salvar-ficha-edit">
    SALVAR
</button>



</div>


</div>
