<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ranking - Grand Line RPG</title>

  <link rel="stylesheet" href="ranking.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">

      <img
        src="https://i.imgur.com/aBJrsQt.png"
        class="logo"
      >

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>- RPG -</p>
      </div>

    </div>

    <nav>
      <a href="index.html">INÍCIO</a>
      <a href="ranking.html">RANKING</a>
    </nav>

  </header>

  <!-- TÍTULO -->
  <section class="ranking-title">

    <h1>RANKING GLOBAL</h1>

    <p>
      Os piratas mais procurados do Grand Line.
    </p>

  </section>

  <!-- RANKING -->
  <main id="ranking-container"></main>

  <script>

    const sheetURL =
      "https://opensheet.elk.sh/2PACX-1vRvL6Kx54ljmP5uP_v9MaKvJVNG78mgVRzImGRdM2QNoGQmEg2IXdgi8JM5d-K9OUAUojX1BM3z1hdT/teste";

    fetch(sheetURL)
      .then(res => res.json())
      .then(data => {

        const container =
          document.getElementById("ranking-container");

        data.forEach((player, index) => {

          container.innerHTML += `

            <div class="card">

              <div class="rank">
                #${index + 1}
              </div>

              <div class="info">

                <h2>${player.nome}</h2>

                <p>
                  💰 ${player.recompensa}
                </p>

              </div>

            </div>

          `;

        });

      });

  </script>

</body>
</html>
