<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Combate - Grand Line RPG</title>

  <link rel="stylesheet" href="combate.css">
</head>

<body>

  <div class="battle-screen">

    <!-- HUD -->
    <div class="hud">
      <div class="turn-info">
        Turno: <span id="turn">1</span>
      </div>

      <div class="timer">
        Tempo: <span id="time">30</span>s
      </div>
    </div>

    <!-- ARENA DESKTOP -->
    <div class="arena">

      <!-- PLAYER 1 -->
      <div class="player player-1">

        <div class="player-info">
          <h2>Jogador 1</h2>
          <div class="hp-bar">
            <div class="hp-fill" id="hp1"></div>
          </div>
        </div>

        <div class="cards" id="cards-p1">
          <div class="card">Carta 1</div>
          <div class="card">Carta 2</div>
          <div class="card">Carta 3</div>
        </div>

      </div>

      <!-- VS -->
      <div class="vs">
        VS
      </div>

      <!-- PLAYER 2 -->
      <div class="player player-2">

        <div class="player-info">
          <h2>Adversário</h2>
          <div class="hp-bar">
            <div class="hp-fill" id="hp2"></div>
          </div>
        </div>

        <div class="cards" id="cards-p2">
          <div class="card">Carta A</div>
          <div class="card">Carta B</div>
          <div class="card">Carta C</div>
        </div>

      </div>

    </div>

  </div>

  <script src="combate.js"></script>

</body>
</html>
