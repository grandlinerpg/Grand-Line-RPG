<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Akuma no Mi - Grand Line RPG</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../guia.css">
  <link rel="stylesheet" href="estilo-luta.css">
  <link rel="stylesheet" href="../perfil/inventario.css">
  <link rel="stylesheet" href="akuma-no-mi.css">
  <link rel="stylesheet" href="../perfil/skills.css">
  <link rel="stylesheet" href="../perfil/ficha.css">
  <link rel="stylesheet" href="../perfil/card.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="logo-area">

      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo"
      >

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>

    </div>

    <nav>
      <a id="home-link" href="index.html">INÍCIO</a>

      <a href="faccao.html">FACÇÃO</a>

      <a href="mapa.html">MAPA</a>

      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <!-- TÍTULO -->

  <section class="guide-title">

    <h1>AKUMA NO MI</h1>

    <p>
      Frutas misteriosas capazes de conceder poderes sobrenaturais.
    </p>

  </section>

  <div class="category-filter">

    <select id="category-select">

      <option value="Todos">Todas as Categorias</option>
      <option value="Logia">Logia</option>
      <option value="Paramecia">Paramecia</option>
      <option value="Zoan">Zoan</option>

    </select>

  </div>

  <!-- LISTA -->

  <main id="list"></main>

  <!-- MODAL -->

  <div id="modal" class="modal">

    <div class="modal-content">

      <button
        class="close-item-x"
        onclick="closeModal()"
      >
        ×
      </button>

      <img id="m-img" class="modal-img">

      <h2 id="m-title"></h2>

      <p id="m-desc"></p>

      <img id="m-tier-img" class="modal-tier-img">

      <button id="m-btn">VER HABILIDADES</button>

    </div>

  </div>

  <div id="habilidades-container"></div>
  <div id="ficha-container"></div>
  <div id="card-container"></div>

  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      get
    }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    /* FIREBASE CONFIG */

    const firebaseConfig = {

      apiKey: "AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",

      authDomain: "grand-line-rpg-dcda9.firebaseapp.com",

      projectId: "grand-line-rpg-dcda9",

      storageBucket: "grand-line-rpg-dcda9.appspot.com",

      messagingSenderId: "172042779786",

      appId: "1:172042779786:web:ecdff9eaf4fee36eca8173",

      databaseURL:
      "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"

    };

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    /* CLOUDINARY BASE */

    const CLOUD =
      "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/";

    /* IMAGENS DOS TIERS */

    const tiersImg = {

      1:
      "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-1.png",

      2:
      "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-2.png",

      3:
      "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-3.png",

      4:
      "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-4.png",

      5:
      "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-5.png",

      6:
      "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-6.png"
      
    };

    const list = document.getElementById("list");
    let filtroAtual = "Todos";

    /* CARREGAR AKUMA NO MI */

    async function loadAkumas() {

      list.innerHTML = "";

      const snap = await get(
        ref(db, "itens/Akuma no Mi")
      );

      if (!snap.exists()) return;

      const data = Object.values(snap.val());

      for (let t = 1; t <= 6; t++) {
    
        const frutas = data.filter(a => {

          const tierOk = Number(a.tier) === t;
          const categoria = (a.ctg || "").trim();

          if (!categoria) return false;
          const categoriaOk =
            filtroAtual === "Todos" ||
            categoria.toLowerCase() === filtroAtual.toLowerCase();

          return tierOk && categoriaOk;

        });

        if (!frutas.length) continue;

        /* SEPARADOR */

        const sep = document.createElement("div");

        sep.className = "tier-sep";

        sep.innerHTML = `<img src="${tiersImg[t]}">`;

        list.appendChild(sep);

        /* ITENS */

        frutas.forEach(a => {

          const item = document.createElement("div");

          item.className = "item";

          item.innerHTML = `
            <img src="${CLOUD + a.img}.png">
            <span>${a.nome}</span>
          `;

          item.onclick = () => openModal(a);

          list.appendChild(item);

        });

      }

    }

    loadAkumas();

    /* MODAL */

    function openModal(a){

      document.getElementById("modal")
      .style.display = "flex";

      document.getElementById("m-title")
      .innerText = a.nome;

      document.getElementById("m-desc")
      .innerText = a.description;

      document.getElementById("m-tier-img")
      .src = tiersImg[a.tier];

      document.getElementById("m-img")
      .src = CLOUD + a.img + ".png";

      // 🔥 SÓ ISSO FOI CORRIGIDO
      document.getElementById("m-btn").onclick = () => {

        abrirHabilidades(a.n);

      };
    }

    document
      .getElementById("category-select")
      .addEventListener("change", function () {

        filtroAtual = this.value;

        loadAkumas();

      });

    /* FECHAR MODAL */

    window.closeModal = function(){

      document.getElementById("modal")
      .style.display = "none";

    }

    /* VOLTAR */

    window.voltar = function(){

      history.back();

    }

  </script>

  <script type="module" src="../perfil/card.js"></script>
  <script type="module" src="../perfil/ficha.js"></script>
  <script type="module" src="habilidades.js"></script>

</body>
</html>
