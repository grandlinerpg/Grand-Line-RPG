<div id="ficha-modal" class="ficha-modal">

  <div class="ficha-window">

    <button id="close-ficha">
      ×
    </button>

    <img id="ficha-img" class="ficha-img">
    
    <div class="ficha-scroll">
    
      <h2 id="ficha-nome">
      </h2>

      <p id="ficha-description">
      </p>

      <!-- RANK + ATRIBUTOS -->
      <div class="ficha-status">

        <div class="ficha-rank" id="ficha-rank">
          <b id="ficha-rank-valor">-</b>
        </div>


        <div class="ficha-atributos">

          <div class="ficha-atributo" id="atributo-atk">
            <span>ATK: </span>
            <b id="ficha-atk">-</b>
          </div>

          <div class="ficha-atributo" id="atributo-def">
            <span>DEF: </span>
            <b id="ficha-def">-</b>
          </div>

          <div class="ficha-atributo" id="atributo-pow">
            <span>POW: </span>
            <b id="ficha-pow">-</b>
          </div>

          <div class="ficha-atributo" id="atributo-stm">
            <span>STM: </span>
            <b id="ficha-stm">-</b>
          </div>

        </div>
          
      </div>

      <div class="ficha-efeito">

          <div id="ficha-efeitoss">
              -
          </div>

      </div>
      
      <table class="ficha-table">

        <tr id="linha-cooldown">
          <td>Cooldown</td>
          <td id="ficha-cooldown">-</td>
        </tr>
      
        <tr id="linha-categoria">
          <td>Categoria</td>
          <td id="ficha-categoria">-</td>
        </tr>

        <tr id="linha-propriedade">
          <td>Propriedade</td>
          <td id="ficha-propriedade">-</td>
        </tr>
      
        <tr id="linha-alcance">
          <td>Alcance</td>
          <td id="ficha-alcance">-</td>
        </tr>

        <tr id="linha-alvos">
          <td>Alvos</td>
          <td id="ficha-alvos">-</td>
        </tr>

        <tr id="linha-degradation">
          <td>Degradação</td>
          <td id="ficha-degradation">-</td>
        </tr>

        <tr id="linha-antidodging">
          <td>Anti-Dodging</td>
          <td id="ficha-antidodging">-</td>
        </tr>

    </table>

    </div>



    <div class="ficha-bottom">

      <div class="price-box" id="ficha-cost">
        0 PTS
      </div>

      <div class="item-actions">

        <button id="ficha-buy-btn">
          APRENDER
        </button>

        <button id="ficha-edit-btn">
           EDITAR
        </button>

      </div>

    </div>
    
  </div>

</div>

<div id="confirm-skill-modal" class="item-modal">

  <div class="item-window">

    <div class="item-top">

      <div class="item-info">
        <h2 id="confirm-skill-title">TEM CERTEZA?</h2>
      </div>

      <p style="color:#ddd; text-align:center;">
        Você deseja aprender essa habilidade?
      </p>

    </div>

    <div class="item-actions">

      <button id="confirm-skill-yes">SIM</button>
      <button id="confirm-skill-no">NÃO</button>

    </div>

  </div>

</div>

<div id="skill-result-modal" class="item-modal">

  <div class="item-window">

    <div class="item-top">

      <div class="item-info">
        <h2 id="skill-result-title">MENSAGEM</h2>
      </div>

      <p
        id="skill-result-text"
        style="color:#ddd; text-align:center;"
      >
        Escrever resultado!
      </p>

    </div>

    <div class="item-actions">

      <button id="skill-result-ok">
        OK
      </button>

    </div>

  </div>

</div>
