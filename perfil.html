<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perfil - Grand Line RPG</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="perfil.css">
</head>

<body>

  <!-- FUNDO IGUAL INDEX -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR IGUAL INDEX -->
  <header class="navbar">

    <div class="logo-area">

      <img src="https://i.imgur.com/aBJrsQt.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>

    </div>

    <nav>
      <a href="index.html">INÍCIO</a>
      <a href="jogadores.html">JOGADORES</a>
      <a href="faccoes.html">FACÇÕES</a>
      <a href="mapa.html">MAPA</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <!-- CONTEÚDO PERFIL -->
  <main class="profile-container">

    <div class="profile-card">

      <h1 id="nomeJogador">Carregando...</h1>

      <p id="nomePersonagem">Personagem: --</p>

      <div class="profile-grid">

        <div>⚔️ Estilo: <span id="estilo">--</span></div>
        <div>🧬 Raça: <span id="raca">--</span></div>
        <div>🍎 Akuma no Mi: <span id="akuma">--</span></div>

      </div>

      <hr>

      <h2>Atributos</h2>

      <div class="stats">

        <div>💪 Força: <span id="forca">0</span></div>
        <div>🛡️ Resistência: <span id="resistencia">0</span></div>
        <div>🎯 Destreza: <span id="destreza">0</span></div>
        <div>⚡ Agilidade: <span id="agilidade">0</span></div>
        <div>🔋 Stamina: <span id="stamina">0</span></div>
        <div>❤️ Vida: <span id="vida">0</span></div>

      </div>

      <button onclick="logout()">SAIR</button>

    </div>

  </main>

  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "SUA_API",
      authDomain: "SEU_AUTH",
      projectId: "SEU_ID",
      appId: "SEU_APP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {

      if (!user) {
        window.location.href = "auth.html";
        return;
      }

      document.getElementById("nomeJogador").innerText =
        user.displayName || "Jogador";

      document.getElementById("nomePersonagem").innerText =
        "Personagem: Não definido";

    });

    window.logout = () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    }

  </script>

</body>
</html>
