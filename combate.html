<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Combate - Grand Line RPG</title>

  <link rel="stylesheet" href="combate.css">
</head>

<body>

  <!-- FUNDO -->
  <div class="bg"></div>
  <div class="overlay"></div>

  <!-- HUD (pode evoluir pra turno depois) -->
  <div class="hud">
    <div>⚔️ Combate</div>
    <div>HP SYSTEM TEST</div>
  </div>

  <!-- ARENA -->
  <div class="arena">

    <!-- PLAYER 1 -->
    <div class="player">

      <div class="avatar">
        <img src="https://i.imgur.com/8Km9tLL.png" alt="player1">
      </div>

      <div class="name">Jogador 1</div>

      <div class="hp-bar">
        <div class="hp-fill" id="p1-hp"></div>
      </div>

      <div class="hp-text" id="p1-hp-text">100 / 100</div>

      <!-- CARTAS / AÇÕES -->
      <div class="cards">
        <div class="card" onclick="atacar()">ATACAR</div>
        <div class="card" onclick="defender()">DEFENDER</div>
        <div class="card" onclick="skill()">SKILL</div>
      </div>

    </div>

    <!-- VS -->
    <div class="vs">VS</div>

    <!-- PLAYER 2 -->
    <div class="player">

      <div class="avatar">
        <img src="https://i.imgur.com/3ZQ3Z4H.png" alt="player2">
      </div>

      <div class="name">Adversário</div>

      <div class="hp-bar">
        <div class="hp-fill" id="p2-hp"></div>
      </div>

      <div class="hp-text" id="p2-hp-text">100 / 100</div>

      <!-- CARTAS (visual apenas por enquanto) -->
      <div class="cards">
        <div class="card">???</div>
        <div class="card">???</div>
        <div class="card">???</div>
      </div>

    </div>

  </div>

  <!-- JS -->
  <script src="combate.js"></script>

</body>
</html>
