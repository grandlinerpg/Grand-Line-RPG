<div id="atividades-modal" class="inventory-modal">

  <div class="inventory-window">

    <button id="close-atividades" class="inventory-close-btn">×</button>

    <div class="inventory-header">
      <h2>ATIVIDADES</h2>
    </div>

    <!-- Lista que vai receber os cards idênticos ao inventário -->
    <div id="atividades-list" class="inventory-list"></div>

    <!-- FOOTER COM AS BOX REUTILIZANDO O CSS DE PONTOS -->
    <div class="points-footer">

      <div class="footer-box">
        <p>EXP</p>
        <span id="atividades-exp">0/1.000</span>
      </div>

      <div class="footer-box">
        <p>SALDO</p>
        <span id="atividades-saldo">฿ 0</span>
      </div>

    </div>

  </div>

</div>


<!-- MODAL DE DETALHES DA ATIVIDADE -->
<div id="atividade-detalhe-modal" class="item-modal">

  <div class="item-window">

    <button id="close-detalhe" class="close-item-x">×</button>

    <div class="item-top">

      <div class="item-info">
        <h2 id="detalhe-nome">ATIVIDADE</h2>
      </div>

      <span id="detalhe-emoji" class="item-emoji">🎯</span>
      
      <p id="detalhe-description" style="color: #ddd; font-size: 14px; line-height: 1.5; margin-top: 10px;">
        Descrição...
      </p>

    </div>

    <div class="item-actions" style="margin-top: 20px;">
      <button id="participar-atividade" style="width:100%;">PARTICIPAR</button>
    </div>

  </div>

</div>
