<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jogadores - Grand Line RPG</title>

  <link rel="stylesheet" href="jogadores.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">

      <img
        src="https://i.imgur.com/aBJrsQt.png"
        class="logo"
      >

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>

    </div>

    <nav>
      <a href="index.html">INÍCIO</a>
      <a href="jogadores.html">JOGADORES</a>
    </nav>

  </header>

  <!-- TÍTULO -->
  <section class="players-title">

    <h1>JOGADORES</h1>

    <p>
      Lista oficial de jogadores do Grand Line RPG.
    </p>

  </section>

  <!-- PLAYERS -->
  <main id="players-container"></main>

  <!-- MODAL -->
  <div id="modal" class="modal">

    <div class="modal-box">

      <span class="close" onclick="closeModal()">×</span>

      <img id="modal-img" class="modal-img">

      <h2 id="modal-nome"></h2>

      <p id="modal-nivel"></p>
      <p id="modal-exp"></p>
      <p id="modal-dinheiro"></p>

    </div>

  </div>

  <script>

    const sheetURL =
      "https://opensheet.elk.sh/1-JMYZlXQ9bi4MftELWt13k9F3LpufVZ46I4c17Fnk_I/teste";

    fetch(sheetURL)
      .then(response => response.json())
      .then(data => {

        const container =
          document.getElementById("players-container");

        data.forEach(player => {

          container.innerHTML += `

            <div class="card"
              onclick="openModal(
                '${player.foto}',
                '${player.nome}',
                '${player.nivel}',
                '${player.exp}',
                '${player.dinheiro}'
              )">

              <img
                src="${player.foto}"
                class="character-img"
                alt="${player.nome}"
              >

              <div class="info">

                <h2>${player.nome}</h2>

                <p>
                  ⭐ Nível:
                  <span>${player.nivel}</span>
                </p>

              </div>

            </div>

          `;

        });

      });

    function openModal(img, nome, nivel, exp, dinheiro){

      document.getElementById("modal").style.display = "flex";

      document.getElementById("modal-img").src = img;

      document.getElementById("modal-nome").innerText =
        nome;

      document.getElementById("modal-nivel").innerText =
        "⭐ Nível: " + nivel;

      document.getElementById("modal-exp").innerText =
        "⚡ EXP: " + exp;

      document.getElementById("modal-dinheiro").innerText =
        "💰 Saldo: " + dinheiro;

      document.body.classList.add("modal-open");
    }

    function closeModal(){

      document.getElementById("modal").style.display =
        "none";

      document.body.classList.remove("modal-open");
    }

    // FECHAR AO CLICAR FORA

    window.onclick = function(event){

      const modal =
        document.getElementById("modal");

      if(event.target == modal){

        closeModal();

      }

    }

  </script>

</body>
</html>
