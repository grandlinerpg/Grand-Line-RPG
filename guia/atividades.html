<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atividades - Grand Line RPG</title>

  <link rel="icon" type="image/png" href="/Grand-Line-RPG/icon-192.png">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../guia.css">
  <link rel="stylesheet" href="estilo-luta.css">
  <link rel="stylesheet" href="akuma-no-mi.css">
  <link rel="stylesheet" href="efeitos.css">
  <link rel="stylesheet" href="../perfil/ficha.css">
  <link rel="stylesheet" href="../perfil/ficha-edit.css">
  <link rel="stylesheet" href="atividades.css">
  <link rel="stylesheet" href="atividade.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* Redução dos espaçamentos gigantes do topo */
    .guide-title {
      padding-bottom: 10px !important;
      margin-bottom: 10px !important;
    }

    .top-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    #list {
      margin-top: 10px !important;
      padding-top: 0 !important;
    }

    .top-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #c8a355;
      color: #c8a355;
      padding: 8px 20px;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .top-btn:hover {
      background: #c8a355;
      color: #000;
      box-shadow: 0 0 10px rgba(200, 163, 85, 0.5);
    }

    /* Ocultar Recompensas quando for Geral (Ativas / Passivas) */
    body.hide-rewards .recompensas-box,
    body.hide-rewards .atividade-recompensas,
    body.hide-rewards [class*="recompensa"],
    body.hide-rewards [class*="exp"],
    body.hide-rewards [class*="berries"] {
      display: none !important;
    }
  </style>

</head>

<body id="atividades-page">

  <div class="background"></div>
  <div class="overlay"></div>

  <header class="navbar">

    <div class="logo-area">

      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>

    </div>

    <nav>

      <a href="../index.html">INÍCIO</a>

      <a href="../faccao.html">FACÇÃO</a>

      <a href="../mapa.html">MAPA</a>

      <a href="../guia.html">GUIA</a>

    </nav>

  </header>

  <section class="guide-title">

    <h1>ATIVIDADES</h1>

    <p>
      Todas as atividades disponíveis no Grand Line RPG.
    </p>

    <!-- Botões no topo -->
    <div class="top-buttons">
      <button class="top-btn" id="btn-ativas">ATIVAS</button>
      <button class="top-btn" id="btn-passivas">PASSIVAS</button>
    </div>

  </section>

  <main id="list"></main>

  <div id="atividade-container"></div>
  <div id="atividade-edit-container"></div>
  
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      get
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {

      apiKey: "AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",
      authDomain: "grand-line-rpg-dcda9.firebaseapp.com",
      projectId: "grand-line-rpg-dcda9",
      storageBucket: "grand-line-rpg-dcda9.appspot.com",
      messagingSenderId: "172042779786",
      appId: "1:172042779786:web:ecdff9eaf4fee36eca8173",
      databaseURL: "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"

    };

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const list =
      document.getElementById("list");

    async function loadAtividades(){

      list.innerHTML = "";

      const snap =
      await get(ref(db,"faccoes"));

      if(!snap.exists()) return;

      const faccoes = snap.val();

      const btnAtivas = document.getElementById("btn-ativas");
      const btnPassivas = document.getElementById("btn-passivas");

      // Função auxiliar para abrir atividade sem recompensas
      const abrirSemRecompensas = (atividadeId) => {
        document.body.classList.add("hide-rewards");
        if (typeof window.abrirAtividade === "function") {
          window.abrirAtividade(atividadeId, "Gerais");
        }
      };

      if (btnAtivas) {
        btnAtivas.onclick = () => abrirSemRecompensas("ativas");
      }

      if (btnPassivas) {
        btnPassivas.onclick = () => abrirSemRecompensas("passivas");
      }

      Object.entries(faccoes).forEach(([id,faccao])=>{

        if (id === "Gerais") return;

        const titulo =
        document.createElement("div");

        titulo.className =
        "skill-rank";

        titulo.innerText =
        faccao.nome || id;

        list.appendChild(titulo);

        if(!faccao.atividades) return;

        Object.entries(faccao.atividades).forEach(([atividadeId,atividade])=>{

          const card =
          document.createElement("div");

          card.className =
          "item";

          card.innerHTML = `
            <div class="item-emoji">
              ${atividade.emoji || "📋"}
            </div>

            <span>
              ${atividade.nome}
            </span>
          `;

          card.onclick = ()=>{
            // Para as atividades normais, garante que as recompensas sejam visíveis
            document.body.classList.remove("hide-rewards");

            console.log({
              faccao:id,
              id:atividadeId,
              atividade
            });

            abrirAtividade(
              atividadeId,
              id
            );
          };

          list.appendChild(card);

        });

      });

    }

    loadAtividades();

  </script>

  <script type="module" src="../permissao.js"></script>
  <script type="module" src="atividade.js"></script>
  <script type="module" src="atividade-edit.js"></script>
  
</body>

</html>
