<div id="sell-modal" class="item-modal">

  <div class="item-window">

    <!-- PREVIEW DO ITEM -->
    <div class="sell-preview">
      <div id="sell-item-image" class="sell-image"></div>
    </div>

    <!-- INFO -->
    <div class="sell-info">

      <p id="sell-min-price" class="sell-min-price">
        Preço mínimo: ฿ 0
      </p>

      <input
        id="sell-price-input"
        type="text"
        placeholder="Digite o valor de venda"
      />

      <input
        id="sell-qty-input"
        type="text"
        placeholder="Quantidade"
      />

    </div>

    <!-- AÇÕES -->
    <div class="item-actions">

      <button id="confirm-sell">
        VENDER
      </button>

      <button id="cancel-sell">
        CANCELAR
      </button>

    </div>

  </div>

</div>
