<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa - Grand Line RPG</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="jogadores.css">
  <link rel="stylesheet" href="mapa.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <header class="navbar">

    <div class="logo-area">
      <img src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png" class="logo" alt="Logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <!-- BOTÃO MENU MOBILE -->
    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir Menu">
      ☰
    </button>

    <!-- MENU -->
    <nav id="nav-menu">
      <a href="index.html" id="home-link">INÍCIO</a>
      <a href="faccao.html">FACÇÃO</a>
      <a href="ranking.html">RANKING</a>
      <a href="mapa.html" class="active">MAPA</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <section class="players-title">
    <h1>MAPA DA GRAND LINE</h1>
    <p>Acompanhe o domínio territorial das ilhas e os exploradores dos mares.</p>
  </section>

  <!-- SELETOR DE ABAS DA DOMINAÇÃO / JOGADORES -->
  <div class="ranking-tabs">
    <button class="tab-btn active" id="btn-dominacao">🏴‍☠️ DOMINAÇÃO</button>
    <button class="tab-btn" id="btn-jogadores">👥 JOGADORES</button>
  </div>

  <main id="mapa-container"></main>

  <!-- FIREBASE SCRIPT -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4kgy_L79WYFQr9XZhoDuBfqG4AGTVUQ",
      authDomain: "grand-line-rpg-dcda9.firebaseapp.com",
      projectId: "grand-line-rpg-dcda9",
      storageBucket: "grand-line-rpg-dcda9.appspot.com",
      messagingSenderId: "172042779786",
      appId: "1:172042779786:web:ecdff9eaf4fee36eca8173",
      databaseURL: "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const container = document.getElementById("mapa-container");
    const btnDominacao = document.getElementById("btn-dominacao");
    const btnJogadores = document.getElementById("btn-jogadores");
    const baseUrl = "https://res.cloudinary.com/djh45admn/image/upload/v1790680862/";

    let mapaIcones = {}; // Cache local para imagens de facções e bandos

    // TROCA INÍCIO POR PERFIL SE ESTIVER LOGADO
    onAuthStateChanged(auth, (user) => {
      const homeLink = document.getElementById("home-link");
      if (homeLink) {
        if (user) {
          homeLink.innerText = "PERFIL";
          homeLink.href = "perfil.html";
        } else {
          homeLink.innerText = "INÍCIO";
          homeLink.href = "index.html";
        }
      }
    });

    // Mapeia previamente todos os PNGs para evitar múltiplas requisições assíncronas em loop
    async function carregarCacheIcones() {
      mapaIcones = {};
      try {
        const [faccoesSnap, bandosSnap] = await Promise.all([
          get(ref(db, "faccoes")),
          get(ref(db, "bandos"))
        ]);

        if (faccoesSnap.exists()) {
          const faccoesData = faccoesSnap.val();
          for (const key in faccoesData) {
            const item = faccoesData[key];
            if (item && item.png) {
              mapaIcones[key.toLowerCase().trim()] = item.png;
            }
          }

          if (faccoesData.Piratas && faccoesData.Piratas.bandos) {
            const bandosPiratas = faccoesData.Piratas.bandos;
            for (const key in bandosPiratas) {
              const item = bandosPiratas[key];
              if (item && item.png) {
                mapaIcones[key.toLowerCase().trim()] = item.png;
              }
            }
          }
        }

        if (bandosSnap.exists()) {
          const bandosData = bandosSnap.val();
          for (const key in bandosData) {
            const item = bandosData[key];
            if (item && item.png) {
              mapaIcones[key.toLowerCase().trim()] = item.png;
            }
          }
        }
      } catch (error) {
        console.error("Erro ao carregar cache de ícones:", error);
      }
    }

    function obterIconeHTML(dominio) {
      if (!dominio) return `<span class="ilha-icone-fallback">🚩</span>`;
      const chave = dominio.toLowerCase().trim();
      const nomePng = mapaIcones[chave];

      if (nomePng) {
        const limpaNome = String(nomePng).replace(/\.png$/i, "").trim();
        const fullUrl = `${baseUrl}${limpaNome}.png`;
        return `<img src="${fullUrl}" alt="${dominio}" class="ilha-icone-faccao">`;
      }

      return `<span class="ilha-icone-fallback">🚩</span>`;
    }

    function formatarEscudos(qtd) {
      const valor = Math.max(0, Math.min(3, parseInt(qtd) || 0));
      const escudosPreenchidos = "🛡️️".repeat(valor);
      const escudosVazios = "🛡️".repeat(3 - valor);
      
      return `<span style="opacity: 1;">${escudosPreenchidos}</span><span style="opacity: 0.25;">${escudosVazios}</span> (${valor}/3)`;
    }

    // CARREGA A ABA DOMINAÇÃO (ILHAS)
    async function carregarDominacao() {
      container.innerHTML = "<p style='color:#fff; text-align:center;'>Carregando ilhas da Grand Line...</p>";

      try {
        await carregarCacheIcones();
        const ilhasSnap = await get(ref(db, "ilhas"));

        if (!ilhasSnap.exists()) {
          container.innerHTML = "<p style='color:#fff; text-align:center;'>Nenhuma ilha cadastrada no momento.</p>";
          return;
        }

        const ilhasData = ilhasSnap.val();
        container.innerHTML = "";

        const listContainer = document.createElement("div");
        listContainer.classList.add("ilhas-list");

        const ids = Object.keys(ilhasData).sort((a, b) => Number(a) - Number(b));

        for (const id of ids) {
          const ilha = ilhasData[id] || {};
          const iconeHTML = obterIconeHTML(ilha.dominio);
          const escudosHTML = formatarEscudos(ilha.escudo);

          const card = document.createElement("div");
          card.classList.add("ilha-card");

          card.innerHTML = `
            <div class="ilha-header">
              <span class="ilha-num">${id}</span>
              <h2 class="ilha-nome">${ilha.nome || 'Ilha Sem Nome'}</h2>
            </div>
            <div class="ilha-detalhes-container">
              <div class="ilha-detalhes-texto">
                <span class="ilha-dominio"><strong>${ilha.dominio || "Desconhecido"}</strong></span>
                <span class="ilha-escudo">${escudosHTML}</span>
              </div>
              ${iconeHTML}
            </div>
          `;

          listContainer.appendChild(card);
        }

        container.appendChild(listContainer);

      } catch (error) {
        console.error("Erro ao carregar ilhas:", error);
        container.innerHTML = "<p style='color:#ff5555; text-align:center;'>Erro ao carregar dados do mapa.</p>";
      }
    }

    // CARREGA A ABA JOGADORES (PRESENÇA NAS ILHAS)
    async function carregarJogadores() {
      container.innerHTML = "<p style='color:#fff; text-align:center;'>Mapeando presença das facções e bandos...</p>";

      try {
        await carregarCacheIcones();

        const [playersSnap, ilhasSnap] = await Promise.all([
          get(ref(db, "players")),
          get(ref(db, "ilhas"))
        ]);

        if (!playersSnap.exists()) {
          container.innerHTML = "<p style='color:#fff; text-align:center;'>Nenhum jogador encontrado.</p>";
          return;
        }

        const playersData = playersSnap.val();
        const ilhasData = ilhasSnap.exists() ? ilhasSnap.val() : {};

        const presencasPorIlha = {};

        Object.values(playersData).forEach(player => {
          if (!player) return;
          const char = player.character || {};
          const info = player.info || {};

          const ilhaId = Number(char.ilha);
          
          if (!ilhaId || ilhaId === 0) return;

          const grupo = char.bando || player.bando || char.faction || "Desconhecido";
          const nivel = Number(info.level || char.level || 1);

          if (!presencasPorIlha[ilhaId]) {
            presencasPorIlha[ilhaId] = {};
          }

          if (!presencasPorIlha[ilhaId][grupo]) {
            presencasPorIlha[ilhaId][grupo] = { forcaTotal: 0, quantidade: 0 };
          }

          presencasPorIlha[ilhaId][grupo].forcaTotal += nivel;
          presencasPorIlha[ilhaId][grupo].quantidade += 1;
        });

        const ilhasComPresenca = Object.keys(presencasPorIlha).sort((a, b) => Number(a) - Number(b));

        if (ilhasComPresenca.length === 0) {
          container.innerHTML = "<p style='color:#fff; text-align:center;'>Nenhum grupo ativo nas ilhas no momento.</p>";
          return;
        }

        container.innerHTML = "";
        const listContainer = document.createElement("div");
        listContainer.classList.add("jogadores-ilhas-list");

        for (const ilhaId of ilhasComPresenca) {
          const ilhaNome = ilhasData[ilhaId] ? ilhasData[ilhaId].nome : `Ilha ${ilhaId}`;
          const grupos = presencasPorIlha[ilhaId];

          const ilhaCard = document.createElement("div");
          ilhaCard.classList.add("presenca-ilha-card");

          let gruposHTML = "";

          for (const [nomeGrupo, dados] of Object.entries(grupos)) {
            const iconeHTML = obterIconeHTML(nomeGrupo);

            gruposHTML += `
              <div class="grupo-presenca-item">
                <div class="grupo-info">
                  ${iconeHTML}
                  <span class="grupo-nome">${nomeGrupo}</span>
                </div>
                <div class="grupo-forca">
                  <span class="label-forca">FORÇA TOTAL</span>
                  <span class="valor-forca">⚔️ ${dados.forcaTotal}</span>
                </div>
              </div>
            `;
          }

          ilhaCard.innerHTML = `
            <div class="ilha-header">
              <span class="ilha-num">${ilhaId}</span>
              <h2 class="ilha-nome">${ilhaNome}</h2>
            </div>
            <div class="grupos-container">
              ${gruposHTML}
            </div>
          `;

          listContainer.appendChild(ilhaCard);
        }

        container.appendChild(listContainer);

      } catch (error) {
        console.error("Erro ao carregar presença dos jogadores:", error);
        container.innerHTML = "<p style='color:#ff5555; text-align:center;'>Erro ao carregar presença nas ilhas.</p>";
      }
    }

    // ALTERNADOR DE ABAS
    function alternarAba(aba) {
      if (btnDominacao) btnDominacao.classList.toggle("active", aba === "dominacao");
      if (btnJogadores) btnJogadores.classList.toggle("active", aba === "jogadores");

      if (aba === "dominacao") {
        carregarDominacao();
      } else {
        carregarJogadores();
      }
    }

    // LISTENERS DE CLIQUE DAS ABAS
    if (btnDominacao) {
      btnDominacao.addEventListener("click", () => alternarAba("dominacao"));
    }
    if (btnJogadores) {
      btnJogadores.addEventListener("click", () => alternarAba("jogadores"));
    }

    // EXPORTA PARA O ESCOPO GLOBAL (caso ainda seja necessário chamar via console ou scripts externos)
    window.alternarAba = alternarAba;

    // INICIALIZADOR DA PÁGINA
    carregarDominacao();

  </script>

  <!-- MENU MOBILE SCRIPT -->
  <script>
    const menuToggle = document.getElementById("menu-toggle");
    const navMenu = document.getElementById("nav-menu");

    if (menuToggle && navMenu) {
      menuToggle.addEventListener("click", () => {
        navMenu.classList.toggle("active");
      });
    }
  </script>

</body>

</html>
