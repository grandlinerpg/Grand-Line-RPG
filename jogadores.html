<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jogadores - Grand Line RPG</title>

  <link rel="stylesheet" href="jogadores.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <header class="navbar">

    <div class="logo-area">
      <img src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <nav>
      <a id="home-link" href="index.html">INÍCIO</a>
      <a href="faccoes.html">FACCÕES</a>
      <a href="jogadores.html">JOGADORES</a>
      <a href="mapa.html">MAPA</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <section class="players-title">
    <h1>JOGADORES</h1>
    <p>Lista oficial de jogadores do Grand Line RPG.</p>
  </section>

  <main id="players-container"></main>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-box">

      <span class="close" onclick="closeModal()">×</span>

      <img id="modal-img" class="modal-img">

      <h2 id="modal-charname"></h2>

      <p id="modal-nome"></p>

      <div id="modal-nivel" class="modal-level-badge">
        1
      </div>
      
      <!-- STATS -->
      <div class="modal-stats">

        <div class="stat-box">
          <span>EXP</span>
          <strong id="modal-exp"></strong>
        </div>

        <div class="stat-box">
          <span>SALDO</span>
          <strong id="modal-dinheiro"></strong>
        </div>

      </div>

    </div>
  </div>

  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      get
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4kgy_L79WYFQr9XZhoDuBfqG4AGTVUQ",
      authDomain: "grand-line-rpg-dcda9.firebaseapp.com",
      projectId: "grand-line-rpg-dcda9",
      storageBucket: "grand-line-rpg-dcda9.appspot.com",
      messagingSenderId: "172042779786",
      appId: "1:172042779786:web:ecdff9eaf4fee36eca8173",
      databaseURL: "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);
    const auth = getAuth(app);

    const container = document.getElementById("players-container");

    // 🔥 TROCA INÍCIO POR PERFIL SE ESTIVER LOGADO
    onAuthStateChanged(auth, (user) => {

      const homeLink = document.getElementById("home-link");

      if (user) {

        homeLink.innerText = "PERFIL";
        homeLink.href = "perfil.html";

      } else {

        homeLink.innerText = "INÍCIO";
        homeLink.href = "index.html";

      }

    });

    function buildImage(charName) {

      const personagem = (charName || "default")
        .toLowerCase()
        .replaceAll(" ", "-")
        .replaceAll(".", "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

      return `https://res.cloudinary.com/djh45admn/image/upload/v1778334616/${personagem}.png?v=${Date.now()}`;
    }

    async function loadPlayers() {

      const snap = await get(ref(db, "players"));

      if (!snap.exists()) return;

      const data = snap.val();

      container.innerHTML = "";

      // 🔥 ORDENA PELO MAIOR EXP
      const playersOrdenados = Object.values(data).sort((a, b) => {
        return (b.info?.exp || 0) - (a.info?.exp || 0);
      });

      playersOrdenados.forEach(player => {

        const card = document.createElement("div");

        card.classList.add("card");

        const charName = player.character?.charName || "Desconhecido";
        const playerName = player.nome || "Sem nome";

        const foto = buildImage(charName);

        const level = player.info?.level || 1;
        const exp = player.info?.exp || 0;
        const dinheiro = player.info?.saldo || 0;

        card.innerHTML = `
          <div class="img-wrap">
            <img src="${foto}" class="character-img" alt="${charName}">

            <div class="nivel-badge">
              ${level}
            </div>
          </div>

          <div class="info">
            <h2>${charName}</h2>
            <p class="player-name">${playerName}</p>
          </div>
        `;

        card.onclick = () =>
          openModal(
            foto,
            charName,
            playerName,
            level,
            exp,
            dinheiro
          );

        container.appendChild(card);

      });

    }

    loadPlayers();

    function openModal(
      img,
      charName,
      playerName,
      level,
      exp,
      dinheiro
    ) {

      document.getElementById("modal").style.display = "flex";

      document.getElementById("modal-img").src = img;

      document.getElementById("modal-charname").innerText = charName;

      document.getElementById("modal-nome").innerText = playerName;

      document.getElementById("modal-nivel").innerText = level;

      document.getElementById("modal-exp").innerText = exp;

      document.getElementById("modal-dinheiro").innerText =
        dinheiro + " ฿";

      document.body.classList.add("modal-open");
    }

    function closeModal() {

      document.getElementById("modal").style.display = "none";

      document.body.classList.remove("modal-open");

    }

    window.openModal = openModal;
    window.closeModal = closeModal;

    window.onclick = function (event) {

      const modal = document.getElementById("modal");

      if (event.target === modal) {

        closeModal();

      }

    };

  </script>

</body>
</html>
