<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perfil - Grand Line RPG</title>

  <link rel="stylesheet" href="perfil.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">

      <img
        src="https://i.imgur.com/aBJrsQt.png"
        class="logo"
      >

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>

    </div>

    <nav>
      <a href="index.html">INÍCIO</a>
      <a href="jogadores.html">JOGADORES</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <!-- PERFIL -->
  <main class="profile-container">

    <div class="profile-card">

      <img
        src="https://i.imgur.com/8Km9tLL.png"
        class="profile-img"
        id="profile-img"
      >

      <h1 id="profile-name">
        Carregando...
      </h1>

      <p class="profile-email" id="profile-email">
        Carregando email...
      </p>

      <div class="profile-info">

        <div class="info-box">
          <span>⭐ Nível</span>
          <h2>1</h2>
        </div>

        <div class="info-box">
          <span>⚡ EXP</span>
          <h2>0</h2>
        </div>

        <div class="info-box">
          <span>💰 Berries</span>
          <h2>0</h2>
        </div>

      </div>

      <button onclick="logout()">
        SAIR DA CONTA
      </button>

    </div>

  </main>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_AUTH_DOMAIN",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_STORAGE_BUCKET",
      messagingSenderId: "SEU_MESSAGING_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {

      if(user){

        document.getElementById("profile-name")
          .innerText =
            user.displayName || "Pirata";

        document.getElementById("profile-email")
          .innerText =
            user.email;

      }else{

        window.location.href = "auth.html";
      }

    });

    window.logout = function(){

      signOut(auth)
        .then(() => {

          window.location.href = "auth.html";

        });

    }

  </script>

</body>
</html>
