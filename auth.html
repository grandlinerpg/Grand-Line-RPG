<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line RPG - Login</title>

  <link rel="stylesheet" href="auth.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- CONTAINER PARA RECAPTCHA INVISÍVEL DO FIREBASE -->
  <div id="recaptcha-container"></div>

  <!-- CONTAINER -->
  <main class="auth-container">

    <!-- LOGIN -->
    <div class="auth-card" id="login-box">

      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo"
      >

      <h1>GRAND LINE RPG</h1>

      <p>
        Entre com seu número de celular para continuar sua jornada.
      </p>

      <form>

        <div class="input-group">

          <label>Celular (com DDD)</label>

          <input
            type="tel"
            id="login-phone"
            placeholder="+5511999998888"
          >

        </div>

        <!-- CAMPO PARA O CÓDIGO SMS (INICIALMENTE OCULTO) -->
        <div class="input-group hidden" id="login-code-group">

          <label>Código SMS (6 dígitos)</label>

          <input
            type="text"
            id="login-code"
            placeholder="123456"
          >

        </div>

        <button
          type="button"
          id="btn-send-login-code"
          onclick="sendLoginCode()"
        >
          ENVIAR CÓDIGO SMS
        </button>

        <button
          type="button"
          id="btn-verify-login-code"
          class="hidden"
          onclick="verifyLoginCode()"
        >
          CONFIRMAR E ENTRAR
        </button>

      </form>

      <div class="switch-page">

        <span>Não possui conta?</span>

        <button
          class="switch-btn"
          onclick="showRegister()"
        >
          REGISTRAR
        </button>

      </div>

    </div>

    <!-- REGISTRO -->
    <div
      class="auth-card hidden"
      id="register-box"
    >

      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo"
      >

      <h1>CRIAR CONTA</h1>

      <p>
        Registre seu celular para começar sua aventura.
      </p>

      <form>

        <div class="input-group">

          <label>Nome do Jogador</label>

          <input
            type="text"
            id="register-name"
            placeholder="Digite seu nome"
          >

        </div>

        <div class="input-group">

          <label>Celular (com DDD)</label>

          <input
            type="tel"
            id="register-phone"
            placeholder="+5511999998888"
          >

        </div>

        <!-- CAMPO PARA O CÓDIGO SMS (INICIALMENTE OCULTO) -->
        <div class="input-group hidden" id="register-code-group">

          <label>Código SMS (6 dígitos)</label>

          <input
            type="text"
            id="register-code"
            placeholder="123456"
          >

        </div>

        <button
          type="button"
          id="btn-send-reg-code"
          onclick="sendRegisterCode()"
        >
          ENVIAR CÓDIGO SMS
        </button>

        <button
          type="button"
          id="btn-verify-reg-code"
          class="hidden"
          onclick="verifyRegisterCode()"
        >
          CONFIRMAR E CRIAR CONTA
        </button>

      </form>

      <div class="switch-page">

        <span>Já possui conta?</span>

        <button
          class="switch-btn"
          onclick="showLogin()"
        >
          LOGIN
        </button>

      </div>

    </div>

  </main>

  <script>

    function showRegister(){

      document
        .getElementById("login-box")
        .classList.add("hidden");

      document
        .getElementById("register-box")
        .classList.remove("hidden");
    }

    function showLogin(){

      document
        .getElementById("register-box")
        .classList.add("hidden");

      document
        .getElementById("login-box")
        .classList.remove("hidden");
    }

  </script>

  <script type="module" src="firebase.js"></script>

</body>
</html>
