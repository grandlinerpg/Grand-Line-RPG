<div id="atividade-edit" class="ficha-edit-modal">


<div class="ficha-edit-window">


<button id="close-atividade-edit" class="close-ficha-edit">
    ×
</button>


<h2>
EDITAR ATIVIDADE
</h2>


<div class="ficha-edit-scroll">


<div class="img-upload-area">


    <div class="img-box">

        <img id="atividade-edit-img" class="edit-img">

    </div>


    <button id="upload-atividade-img-btn" class="upload-img-btn">
        📤
    </button>


    <input
    type="file"
    id="upload-atividade-img-input"
    accept="image/*"
    hidden>


</div>



<label>
Nome
</label>

<input id="atividade-edit-nome">




<label>
Descrição
</label>

<textarea id="atividade-edit-description"></textarea>




<label>
Funcionamento
</label>

<textarea id="atividade-edit-funcionamento"></textarea>




<label>
Extras
</label>

<div id="atividade-extras-edit-area" class="efeitos-edit-area">

</div>

<button
id="add-atividade-extra-edit"
class="add-efeito-edit"
type="button">
+
</button>




<label>
Dinheiro
</label>

<input
id="atividade-edit-dinheiro"
type="number"
min="0">



<label>
EXP
</label>

<input
id="atividade-edit-exp"
type="number"
min="0">


</div>




<button id="salvar-atividade-edit" class="salvar-ficha-edit">
    SALVAR
</button>


</div>


</div>
