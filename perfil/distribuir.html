<!-- MODAL DISTRIBUIR PONTOS -->
<div class="points-modal">

  <div class="points-window">

    <!-- TOPO -->
    <div class="window-top">

      <h1>DISTRIBUIR PONTOS</h1>

      <button class="close-btn">✕</button>

    </div>

    <!-- ATRIBUTOS -->
    <div class="points-list">

      <div class="point-row">
        <span>💪 Força</span>

        <div class="point-controls">
          <span id="modal-str">0</span>
          <button class="plus-btn" id="up-str">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>🛡 Resistência</span>

        <div class="point-controls">
          <span id="modal-res">0</span>
          <button class="plus-btn" id="up-res">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>🎯 Destreza</span>

        <div class="point-controls">
          <span id="modal-dex">0</span>
          <button class="plus-btn" id="up-dex">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>⚡ Agilidade</span>

        <div class="point-controls">
          <span id="modal-agi">0</span>
          <button class="plus-btn" id="up-agi">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>🔥 Stamina</span>

        <div class="point-controls">
          <span id="modal-sta">0</span>
          <button class="plus-btn" id="up-sta">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>❤️ Vida</span>

        <div class="point-controls">
          <span id="modal-hp">0</span>
          <button class="plus-btn" id="up-hp">+</button>
        </div>
      </div>

    </div>

    <!-- RODAPÉ -->
    <div class="points-footer">

      <div class="footer-box">
        <p>PONTOS DISTRIBUÍDOS</p>
        <span id="used-points">0</span>
      </div>

      <div class="footer-box">
        <p>PONTOS DISPONÍVEIS</p>
        <span id="available-points">0</span>
      </div>

    </div>

    <!-- BOTÃO -->
    <button class="save-btn">
      CONFIRMAR
    </button>

  </div>

</div>
