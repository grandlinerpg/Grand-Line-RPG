<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perfil - Grand Line RPG</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perfil.css">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">
      <img src="https://i.imgur.com/aBJrsQt.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <nav>
      <a href="perfil.html">PERFIL</a>
      <a href="faccoes.html">FACÇÕES</a>
      <a href="mapa.html">MAPA</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <!-- PERFIL -->
  <main class="profile-container">

    <div class="profile-card">

      <h1 class="title-center">PERFIL</h1>

      <!-- PERSONAGEM -->
      <div class="profile-header">

        <div class="char-image">
          <img id="char-img" src="https://i.imgur.com/DYQY9IR.png">
        </div>

        <div class="char-info">
          <p><b>Jogador:</b> <span id="player-name">---</span></p>
          <p><b>Personagem:</b> <span id="char-name">---</span></p>
          <p><b>Facção:</b> <span id="faction">---</span></p>
        </div>

        <!-- LEVEL -->
        <div class="level-badge">
          <img src="https://i.imgur.com/rqeoHJs.png" alt="level">
          <span id="level">1</span>
        </div>

      </div>

      <!-- SALDO + EXP (JANELA DUPLA CORRETA) -->
      <div class="top-stats">

        <div class="stat-box">
          💰 SALDO<br>
          <span id="saldo">0</span> ฿
        </div>

        <div class="stat-box">
          ⚡ EXP<br>
          <span id="exp">0</span> / <span id="exp-max">1000</span>
        </div>

      </div>

      <hr>

      <!-- INFORMAÇÕES -->
      <h2 class="title-center">INFORMAÇÕES</h2>

      <div class="profile-grid">

        <div><b>Estilo de Luta:</b> <span id="style">---</span></div>
        <div><b>Raça ou Tribo:</b> <span id="race">---</span></div>
        <div><b>Akuma no Mi:</b> <span id="fruit">---</span></div>

      </div>

      <hr>

      <!-- ATRIBUTOS -->
      <h2 class="title-center">ATRIBUTOS</h2>

      <div class="stats">
        <div>💪 Força: <span id="str">0</span></div>
        <div>🛡 Resistência: <span id="res">0</span></div>
        <div>🎯 Destreza: <span id="dex">0</span></div>
        <div>⚡ Agilidade: <span id="agi">0</span></div>
        <div>🔋 Stamina: <span id="sta">0</span></div>
        <div>❤️ Vida: <span id="hp">0</span></div>
      </div>

      <button onclick="logout()">SAIR DA CONTA</button>

    </div>

  </main>

  <script type="module" src="perfil.js"></script>

</body>
</html>
