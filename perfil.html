<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Perfil - Grand Line RPG</title>

  <link rel="stylesheet" href="perfil.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<main class="profile-container">

  <div class="profile-card">

    <!-- HEADER -->
    <div class="profile-header">

      <img src="https://i.imgur.com/8Km9tLL.png" class="profile-img">

      <div>
        <h1 id="playerName">Carregando...</h1>
        <p id="playerEmail"></p>
      </div>

    </div>

    <!-- INFO RPG -->
    <div class="info-grid">

      <div class="info">
        <span>👤 Personagem</span>
        <p>Luffy Fake</p>
      </div>

      <div class="info">
        <span>🏴 Raça</span>
        <p>Humano</p>
      </div>

      <div class="info">
        <span>⚔️ Estilo</span>
        <p>Espadachim</p>
      </div>

      <div class="info">
        <span>🍎 Akuma no Mi</span>
        <p>Gomu Gomu no Mi</p>
      </div>

    </div>

    <!-- ATRIBUTOS -->
    <h2 class="section-title">Atributos</h2>

    <div class="stats">

      <div class="stat">FOR <b>10</b></div>
      <div class="stat">RES <b>8</b></div>
      <div class="stat">DES <b>7</b></div>
      <div class="stat">AGI <b>9</b></div>
      <div class="stat">STA <b>12</b></div>
      <div class="stat hp">VIDA <b>120</b></div>

    </div>

    <!-- BOTÃO -->
    <button onclick="logout()">SAIR</button>

  </div>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "SEU_AUTH",
  projectId: "SEU_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "auth.html";
    return;
  }

  document.getElementById("playerName").innerText =
    user.displayName || "Pirata desconhecido";

  document.getElementById("playerEmail").innerText =
    user.email;

});

window.logout = async () => {
  await signOut(auth);
  window.location.href = "index.html";
};

</script>

</body>
</html>
