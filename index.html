<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line RPG</title>

  <!-- Fonte RPG -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Fundo -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <!-- LOGO -->
    <div class="logo-area">
      <img src="https://i.imgur.com/aBJrsQt.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>RPG</p>
      </div>
    </div>

    <!-- BOTÃO MOBILE -->
    <button class="menu-btn" id="menuBtn">☰</button>

    <!-- MENU DIREITO -->
    <nav id="menu">
      <a href="#">INÍCIO</a>
      <a href="#">RANKING</a>
      <a href="#">MAPA</a>
      <a href="#">FACÇÕES</a>
      <a href="#">GUIA</a>
    </nav>

  </header>

  <!-- HERO -->
  <main class="hero">

    <img src="https://i.imgur.com/DYQY9IR.png" class="main-logo">

    <p>
      Viva sua própria aventura no Novo Mundo.
      Recrute sua tripulação, enfrente inimigos lendários
      e torne-se o Rei dos Piratas.
    </p>

    <button class="btn-journey">
      ⚓ COMEÇAR JORNADA
    </button>

  </main>

  <script src="script.js"></script>

</body>
</html>
