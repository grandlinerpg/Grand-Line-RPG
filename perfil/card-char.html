<div id="personagem-modal" class="card-modal">

  <div class="card-window personagem-window">


    <button id="close-personagem" class="close-card">
      ×
    </button>


    <div class="personagem-image-area">


      <img id="personagem-img" class="personagem-img"
      src="default-personagem.png">


      <!-- Upload -->
      <label class="upload-personagem">
        UPLOAD

        <input 
        type="file" 
        id="upload-img"
        accept="image/*"
        hidden>

      </label>



      <h2 id="personagem-nome" class="card-nome">
        -
      </h2>



      <div class="personagem-info">

        <div id="personagem-nivel">
          Nível -
        </div>


        <div id="personagem-raca">
          Raça -
        </div>


        <div id="personagem-estilo">
          Estilo -
        </div>

      </div>




      <div class="card-bottom">


        <div class="card-atributos">

          <div id="personagem-for">
            FOR -
          </div>


          <div id="personagem-res">
            RES -
          </div>


          <div id="personagem-agi">
            AGI -
          </div>


          <div id="personagem-dex">
            DEX -
          </div>

        </div>



        <div id="personagem-rank" class="card-rank">
          -
        </div>



      </div>


    </div>



    <button id="download-personagem" class="download-card">
      DOWNLOAD
    </button>



  </div>


</div>
