<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line RPG</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#0f1116">

  <link rel="icon" type="image/png" href="/Grand-Line-RPG/icon-192.png">

  <link rel="apple-touch-icon" href="/Grand-Line-RPG/icon-192.png">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">
      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo"
      >

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <!-- BOTÃO MENU -->
    <button
      class="menu-toggle"
      id="menu-toggle"
      aria-label="Abrir Menu"
    >
      ☰
    </button>

    <!-- MENU -->
    <nav id="nav-menu">

      <a href="index.html">INÍCIO</a>

      <a href="faccoes.html">FACÇÕES</a>

      <a href="jogadores.html">JOGADORES</a>

      <a href="mapa.html">MAPA</a>

      <a href="guia.html">GUIA</a>

    </nav>

  </header>

  <!-- HERO -->
  <main class="hero">

    <img
      src="https://res.cloudinary.com/djh45admn/image/upload/v1778661201/logo2glrpg.png"
      class="main-logo"
    >

    <p>
      VIVA SUA PRÓPRIA AVENTURA NO NOVO MUNDO!
      <br>
      TORNE-SE LENDÁRIO. NAVEGUE. LUTE. CONQUISTE.
    </p>

    <!-- BOTÃO DINÂMICO -->
    <div id="home-button-area">
      <button class="button-loading">
        CARREGANDO...
      </button>
    </div>

  </main>

  <!-- JS -->
  <script type="module" src="index.js"></script>

  <!-- MENU MOBILE -->
  <script>

    const menuToggle = document.getElementById("menu-toggle");
    const navMenu = document.getElementById("nav-menu");

    menuToggle.addEventListener("click", () => {

      navMenu.classList.toggle("active");

    });

  </script>

<script>

if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register(
    "/Grand-Line-RPG/service-worker.js"
  )
  .then(() => {
    console.log("Service Worker ativo");
  })
  .catch(error => {
    console.log("Erro Service Worker:", error);
  });

}

</script>

</body>
</html>
