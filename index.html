<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line RPG</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">

      <img src="https://i.imgur.com/aBJrsQt.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>

    </div>

    <nav>
      <a href="index.html" id="home-link">INÍCIO</a>
      <a href="jogadores.html">JOGADORES</a>
      <a href="faccoes.html">FACÇÕES</a>
      <a href="mapa.html">MAPA</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <!-- HERO -->
  <main class="hero">

    <img src="https://i.imgur.com/DYQY9IR.png" class="main-logo">

    <p>
      VIVA SUA PRÓPRIA AVENTURA NO NOVO MUNDO!<br>
      TORNE-SE LENDÁRIO. NAVEGUE. LUTE. CONQUISTE.
    </p>

    <div id="home-button-area">
      <a href="auth.html" class="hero-btn">⚓ COMEÇAR JORNADA</a>
    </div>

  </main>

  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // 🔥 TROCA AQUI PELO SEU FIREBASE REAL
    const firebaseConfig = {
      apiKey: "SUA_KEY",
      authDomain: "SEU_AUTH",
      projectId: "SEU_ID",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const area = document.getElementById("home-button-area");
    const homeLink = document.getElementById("home-link");

    setPersistence(auth, browserLocalPersistence)
      .then(() => {

        onAuthStateChanged(auth, (user) => {

          console.log("USER:", user); // DEBUG

          if (user) {

            // 🔥 LOGADO
            homeLink.textContent = "PERFIL";
            homeLink.href = "perfil.html";

            area.innerHTML = `
              <a href="perfil.html" class="hero-btn">👤 MEU PERFIL</a>
            `;

          } else {

            // ⚓ DESLOGADO
            homeLink.textContent = "INÍCIO";
            homeLink.href = "index.html";

            area.innerHTML = `
              <a href="auth.html" class="hero-btn">⚓ COMEÇAR JORNADA</a>
            `;

          }

        });

      });

  </script>

</body>
</html>
