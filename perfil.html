<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perfil - Grand Line RPG</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perfil.css">
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">
      <img src="https://i.imgur.com/aBJrsQt.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <nav>
      <a href="index.html">INÍCIO</a>
      <a href="jogadores.html">JOGADORES</a>
      <a href="faccoes.html">FACÇÕES</a>
      <a href="mapa.html">MAPA</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <!-- PERFIL -->
  <main class="profile-container">

    <div class="profile-card">

      <h1>👤 PERFIL DO JOGADOR</h1>

      <p id="email">Carregando...</p>

      <hr>

      <div class="profile-grid">
        <div><b>Jogador:</b> <span id="player-name">---</span></div>
        <div><b>Personagem:</b> <span id="char-name">---</span></div>
        <div><b>Estilo:</b> <span id="style">---</span></div>
        <div><b>Raça:</b> <span id="race">---</span></div>
        <div><b>Akuma no Mi:</b> <span id="fruit">---</span></div>
      </div>

      <hr>

      <h2>⚔️ ATRIBUTOS</h2>

      <div class="stats">
        <div>💪 Força: <span id="str">0</span></div>
        <div>🛡 Resistência: <span id="res">0</span></div>
        <div>🎯 Destreza: <span id="dex">0</span></div>
        <div>⚡ Agilidade: <span id="agi">0</span></div>
        <div>🔋 Stamina: <span id="sta">0</span></div>
        <div>❤️ Vida: <span id="hp">0</span></div>
      </div>

      <button onclick="logout()">SAIR DA CONTA</button>

    </div>

  </main>

  <!-- FIREBASE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // ======================
    // SUA CONFIG FIREBASE
    // ======================
    const firebaseConfig = {
      apiKey: "AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",
      authDomain: "grand-line-rpg-dcda9.firebaseapp.com",
      projectId: "grand-line-rpg-dcda9",
      storageBucket: "grand-line-rpg-dcda9.firebasestorage.app",
      messagingSenderId: "172042779786",
      appId: "1:172042779786:web:ecdff9eaf4fee36eca8173",
      measurementId: "G-1H48YJSFXQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    async function startAuth() {

      await setPersistence(auth, browserLocalPersistence);

      onAuthStateChanged(auth, (user) => {

        if (!user) {
          window.location.replace("auth.html");
          return;
        }

        // ======================
        // DADOS DO USUÁRIO
        // ======================
        document.getElementById("email").innerText = user.email;

        // 🔥 MOCK (depois vamos puxar do Firestore)
        document.getElementById("player-name").innerText = "Pirata";
        document.getElementById("char-name").innerText = "Monkey D. Teste";
        document.getElementById("style").innerText = "Espadachim";
        document.getElementById("race").innerText = "Humano";
        document.getElementById("fruit").innerText = "Nenhuma";

        document.getElementById("str").innerText = 10;
        document.getElementById("res").innerText = 8;
        document.getElementById("dex").innerText = 12;
        document.getElementById("agi").innerText = 15;
        document.getElementById("sta").innerText = 20;
        document.getElementById("hp").innerText = 100;

      });

    }

    startAuth();

    window.logout = function () {
      signOut(auth).then(() => {
        window.location.replace("index.html");
      });
    };

  </script>

</body>
</html>
