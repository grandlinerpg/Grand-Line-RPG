<div id="market-modal" class="market-modal">

  <div class="inventory-window">

    <button id="close-market" class="inventory-close-btn">×</button>

    <div class="inventory-header">
      <h2>MERCADO</h2>
    </div>

    <div class="market-filter">
      <select id="market-category">
        <option value="all">Todas as Categorias</option>
      </select>
    </div>

    <div id="market-list" class="inventory-list"></div>

  </div>

</div>

<!-- ITEM MODAL -->
<div id="market-item-modal" class="item-modal">

  <div class="item-window">

    <button id="close-market-item" class="close-item-x">×</button>

    <div class="item-top">

      <div class="item-info">
        <h2 id="market-item-name">ITEM</h2>
      </div>

      <span id="market-item-emoji" class="item-emoji">📦</span>

      <p id="market-item-description">
        Descrição...
      </p>

    </div>

    <!-- 🔥 BOTÃO FIXO (SEM JS CRIANDO ELEMENTO) -->
    <div class="item-actions">

      <div class="price-box" id="market-item-price">฿ 0</div>

      <button id="market-buy-btn">COMPRAR</button>

    </div>

  </div>

</div>

<!-- 🔥 CONFIRMAÇÃO DE COMPRA -->
<div id="market-confirm-modal" class="item-modal">

  <div class="item-window">

    <div class="item-top">

      <div class="item-info">
        <h2>CONFIRMAR COMPRA</h2>
      </div>

      <span id="confirm-item-emoji" class="item-emoji">📦</span>

      <div class="item-info">
        <p id="confirm-item-name">
          Nome do Item
        </p>

        <p id="confirm-item-seller">
          Anunciado por Jogador
        </p>
        
      </div>

      <div class="market-buy-quantity">
        <select id="market-quantity-select">
          <option value="1">1</option>
        </select>
        <div class="price-box" id="market-total-price">฿ 0</div>
      </div>

    </div>

    <div class="item-actions">

      <button id="market-confirm-yes">CONFIRMAR</button>
      <button id="market-confirm-no">CANCELAR</button>

    </div>

  </div>

</div>

<!-- 🔥 SUCESSO -->

  <div id="market-success-modal" class="item-modal">

  <div class="item-window">

    <div class="item-top">

      <div class="item-info">
        <h2 id="market-success-title">COMPRA REALIZADA</h2>
      </div>

      <p id="market-success-text"></p>

    </div>

    <div class="item-actions">

      <button id="market-success-ok">OK</button>

    </div>

  </div>

</div>
