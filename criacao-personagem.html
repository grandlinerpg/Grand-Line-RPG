<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Criar Personagem - Grand Line RPG</title>

  <!-- CSS -->
  <link rel="stylesheet" href="criacao-personagem.css">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- CONTAINER -->
  <div class="create-container">

    <div class="create-card">

      <!-- LOGO -->
      <img class="logo" src="https://i.imgur.com/aBJrsQt.png">

      <h1>CRIAÇÃO DE PERSONAGEM</h1>
      <p>Escolha seu personagem e seu estilo de luta.</p>

      <!-- PREVIEW -->
      <div class="preview-box">
        <img 
          id="preview-img"
          src=""
          alt="preview personagem"
        >
      </div>

      <!-- PERSONAGEM -->
      <div class="input-group">
        <label>Personagem</label>

        <select id="personagem">

          <option value="Arlong">Arlong</option>
          <option value="Boa Hancock">Boa Hancock</option>
          <option value="Borsalino">Borsalino</option>
          <option value="Brook">Brook</option>
          <option value="Buggy">Buggy</option>
          <option value="Charlotte Katakuri">Charlotte Katakuri</option>
          <option value="Charlotte Linlin">Charlotte Linlin</option>
          <option value="Coby">Coby</option>
          <option value="Crocodile">Crocodile</option>
          <option value="Donquixote Doflamingo">Donquixote Doflamingo</option>
          <option value="Dracule Mihawk">Dracule Mihawk</option>
          <option value="Edward Newgate">Edward Newgate</option>
          <option value="Edward Weevil">Edward Weevil</option>
          <option value="Emporio Ivankov">Emporio Ivankov</option>
          <option value="Enel">Enel</option>
          <option value="Eustass Kid">Eustass Kid</option>
          <option value="Franky">Franky</option>
          <option value="Gol D. Roger">Gol D. Roger</option>
          <option value="Issho">Issho</option>
          <option value="Jewelry Bonney">Jewelry Bonney</option>
          <option value="Jinbe">Jinbe</option>
          <option value="Kaidou">Kaidou</option>
          <option value="Kaku">Kaku</option>
          <option value="Killer">Killer</option>
          <option value="Koby">Koby</option>
          <option value="Kozuki Oden">Kozuki Oden</option>
          <option value="Kuzan">Kuzan</option>
          <option value="Loki">Loki</option>
          <option value="Marco">Marco</option>
          <option value="Marshall D. Teach">Marshall D. Teach</option>
          <option value="Monkey D. Dragon">Monkey D. Dragon</option>
          <option value="Monkey D. Garp">Monkey D. Garp</option>
          <option value="Monkey D. Luffy">Monkey D. Luffy</option>
          <option value="Nami">Nami</option>
          <option value="Nico Robin">Nico Robin</option>
          <option value="Portgas D. Ace">Portgas D. Ace</option>
          <option value="Queen">Queen</option>
          <option value="Roronoa Zoro">Roronoa Zoro</option>
          <option value="Sabo">Sabo</option>
          <option value="Sakazuki">Sakazuki</option>
          <option value="Sanji Vinsmoke">Sanji Vinsmoke</option>
          <option value="Shanks">Shanks</option>
          <option value="Silvers Rayleigh">Silvers Rayleigh</option>
          <option value="Smoker">Smoker</option>
          <option value="Tony Tony Chopper">Tony Tony Chopper</option>
          <option value="Trafalgar D. Water Law">Trafalgar D. Water Law</option>
          <option value="Usopp">Usopp</option>
          <option value="Yamato">Yamato</option>
          <option value="Yasopp">Yasopp</option>

        </select>
      </div>

      <!-- ESTILO -->
      <div class="input-group">
        <label>Estilo de Luta</label>

        <select id="estilo">
          <option value="Espadachim">Espadachim</option>
          <option value="Boxeador">Boxeador</option>
          <option value="Atirador">Atirador</option>
          <option value="Black Leg">Black Leg</option>
          <option value="Rokushiki">Rokushiki</option>
        </select>
      </div>

      <!-- BOTÃO -->
      <button onclick="criarPersonagem()">
        CRIAR PERSONAGEM
      </button>

    </div>

  </div>

  <!-- JS -->
  <script type="module" src="criacao-personagem.js"></script>

</body>
</html>
