<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line RPG</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <header class="navbar">

    <div class="logo-area">
      <img src="https://i.imgur.com/aBJrsQt.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <nav>
      <a href="index.html">INÍCIO</a>
      <a href="jogadores.html">JOGADORES</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <main class="hero">

    <img src="https://i.imgur.com/DYQY9IR.png" class="main-logo">

    <p>
      VIVA SUA PRÓPRIA AVENTURA NO NOVO MUNDO!<br>
      TORNE-SE LENDÁRIO. NAVEGUE. LUTE. CONQUISTE.
    </p>

    <div id="home-button-area"></div>

  </main>

  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "SUA_KEY",
      authDomain: "SEU_AUTH",
      projectId: "SEU_ID",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const area = document.getElementById("home-button-area");

    let loaded = false;

    onAuthStateChanged(auth, (user) => {

      if (loaded) return;
      loaded = true;

      if (user) {

        area.innerHTML = `
          <a href="perfil.html" class="hero-btn">👤 MEU PERFIL</a>
        `;

      } else {

        area.innerHTML = `
          <a href="auth.html" class="hero-btn">⚓ COMEÇAR JORNADA</a>
        `;

      }

    });

  </script>

</body>
</html>
