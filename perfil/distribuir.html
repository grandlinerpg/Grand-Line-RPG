<!-- MODAL DISTRIBUIR PONTOS -->
<div class="points-modal">

  <div class="points-window">

    <button class="distribuir-close-btn">×</button>

    <!-- TOPO -->
    <div class="window-top">
      <h1>DISTRIBUIÇÃO</h1>
    </div>

    <!-- ATRIBUTOS -->
    <div class="points-list">

      <div class="point-row">
        <span>💪 Força</span>

        <div class="point-controls">
          <button class="minus-btn" id="down-str">-</button>
          <span id="modal-str">0/20</span>
          <button class="plus-btn" id="up-str">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>🛡️ Resistência</span>

        <div class="point-controls">
          <button class="minus-btn" id="down-res">-</button>
          <span id="modal-res">0/20</span>
          <button class="plus-btn" id="up-res">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>🎯 Destreza</span>

        <div class="point-controls">
          <button class="minus-btn" id="down-dex">-</button>
          <span id="modal-dex">0/20</span>
          <button class="plus-btn" id="up-dex">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>⚡ Agilidade</span>

        <div class="point-controls">
          <button class="minus-btn" id="down-agi">-</button>
          <span id="modal-agi">0/20</span>
          <button class="plus-btn" id="up-agi">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>🔥 Stamina</span>

        <div class="point-controls">
          <button class="minus-btn" id="down-sta">-</button>
          <span id="modal-sta">0/20</span>
          <button class="plus-btn" id="up-sta">+</button>
        </div>
      </div>

      <div class="point-row">
        <span>❤️ Vida</span>

        <div class="point-controls">
          <button class="minus-btn" id="down-hp">-</button>
          <span id="modal-hp">0/20</span>
          <button class="plus-btn" id="up-hp">+</button>
        </div>
      </div>

    </div>

    <!-- RODAPÉ -->
    <div class="points-footer">

      <div class="footer-box">
        <p>PONTOS DISTRIBUÍDOS</p>
        <span id="used-points">0</span>
      </div>

      <div class="footer-box">
        <p>PONTOS DISPONÍVEIS</p>
        <span id="available-points">0</span>
      </div>

    </div>

    <!-- BOTÃO -->
    <button class="save-btn">
      CONFIRMAR
    </button>

  </div>

</div>
