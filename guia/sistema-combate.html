<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema de Combate - Grand Line RPG</title>

  <link rel="icon" type="image/png" href="/Grand-Line-RPG/icon-192.png">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../guia.css">
  <link rel="stylesheet" href="estilo-luta.css">
  <link rel="stylesheet" href="../perfil/inventario.css">
  <link rel="stylesheet" href="akuma-no-mi.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="logo-area">

      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo"
      >

      <div class="logo-text">

        <h1>GRAND LINE</h1>

        <p>— RPG —</p>

      </div>

    </div>

    <nav>

      <a id="home-link" href="../index.html">INÍCIO</a>

      <a href="../faccao.html">FACÇÃO</a>

      <a href="../mapa.html">MAPA</a>

      <a href="../guia.html">GUIA</a>

    </nav>

  </header>

  <!-- TÍTULO -->

  <section class="guide-title">

    <h1>SISTEMA DE COMBATE</h1>

    <p>
      Conheça todas as mecânicas do combate.
    </p>

  </section>

  <!-- LISTA -->

  <main id="list">

    <div
      class="item"
      onclick="openCombat('ataque')"
    >

      <div class="item-emoji">
        ⚔️
      </div>

      <span>
        Ataque e Defesa
      </span>

    </div>

    <div
      class="item"
      onclick="openCombat('anti')"
    >

      <div class="item-emoji">
        🎯
      </div>

      <span>
        Anti-Dodging
      </span>

    </div>

    <div
      class="item"
      onclick="openCombat('counter')"
    >

      <div class="item-emoji">
        🛡️
      </div>

      <span>
        Counter-Clash
      </span>

    </div>

  </main>

  <!-- MODAL -->

  <div
    id="modal"
    class="modal"
  >

    <div class="modal-content">

      <button
        class="close-item-x"
        onclick="closeModal()"
      >
        ×
      </button>

      <h2 id="m-title"></h2>

      <p id="m-desc"></p>

    </div>

  </div>

  <script type="module">

    import { initializeApp }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {

      apiKey: "AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",

      authDomain: "grand-line-rpg-dcda9.firebaseapp.com",

      projectId: "grand-line-rpg-dcda9",

      storageBucket: "grand-line-rpg-dcda9.appspot.com",

      messagingSenderId: "172042779786",

      appId: "1:172042779786:web:ecdff9eaf4fee36eca8173",

      databaseURL:
      "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"

    };

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const voltarBtn =
      document.getElementById("voltarBtn");

    onAuthStateChanged(auth, (user) => {

      if (user) {

        voltarBtn.textContent = "PERFIL";

        voltarBtn.href = "../perfil.html";

      } else {

        voltarBtn.textContent = "INÍCIO";

        voltarBtn.href = "../index.html";

      }

    });

    const combats = {

      ataque: {

        title:
        "Ataque e Defesa",

        description:
        "Descrição temporária."

      },

      anti: {

        title:
        "Anti-Dodging",

        description:
        "Descrição temporária."

      },

      counter: {

        title:
        "Counter-Clash",

        description:
        "Descrição temporária."

      }

    };

    window.openCombat = function(id){

      const c = combats[id];

      document.getElementById("m-title")
      .innerText = c.title;

      document.getElementById("m-desc")
      .innerText = c.description;

      document.getElementById("modal")
      .style.display = "flex";

    }

    window.closeModal = function(){

      document.getElementById("modal")
      .style.display = "none";

    }

  </script>

</body>

</html>
