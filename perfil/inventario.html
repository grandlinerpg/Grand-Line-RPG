<div id="inventory-modal" class="inventory-modal">

  <div class="inventory-window">

    <button id="close-inventory" class="inventory-close-btn">↩</button>

    <div class="inventory-header">
      <h2>INVENTÁRIO</h2>
    </div>

    <div id="inventory-list" class="inventory-list"></div>

    <div class="inventory-footer">

      <div class="inventory-saldo">
        <div>SALDO</div>
        <div id="inventory-saldo">฿ 0</div>
      </div>

      <button id="open-market" class="market-btn">
        MERCADO
      </button>

    </div>

  </div>

</div>


<!-- ITEM MODAL -->
<div id="item-modal" class="item-modal">

  <div class="item-window">

    <button id="close-item" class="close-item-x">↩</button>

    <div class="item-top">
      <span id="item-emoji" class="item-emoji">📦</span>

      <div class="item-info">
        <h2 id="item-name">ITEM</h2>
        <p id="item-description">Descrição...</p>
      </div>
    </div>

    <div class="item-actions">
      <button id="use-item">USAR</button>
      <button id="sell-item">VENDER</button>
    </div>

  </div>

</div>


<!-- CONFIRMAÇÃO (FORA DO ITEM MODAL!) -->
<div id="confirm-modal" class="item-modal">

  <div class="item-window">

    <div class="item-top">

      <h2 style="color:#f6d365; font-family:'Cinzel', serif;">
        TEM CERTEZA?
      </h2>

      <p style="color:#ddd; text-align:center;">
        Você deseja usar este item?
      </p>

    </div>

    <div class="item-actions">

      <button id="confirm-yes">SIM</button>
      <button id="confirm-no">NÃO</button>

    </div>

  </div>

</div>

<div id="result-modal" class="item-modal">
  <div class="item-window">

    <h2 id="result-title">RESULTADO</h2>

    <!-- 👇 IMAGEM / EMOJI DO ITEM -->
    <div id="result-icon" class="item-emoji">📦</div>

    <div id="result-content" class="result-content"></div>

    <button id="close-result" class="item-actions">>OK</button>

  </div>
</div>
