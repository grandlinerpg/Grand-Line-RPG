<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Efeitos - Grand Line RPG</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../guia.css">
  <link rel="stylesheet" href="estilo-luta.css">
  <link rel="stylesheet" href="../perfil/inventario.css">
  <link rel="stylesheet" href="../perfil/ficha.css">
  <link rel="stylesheet" href="estilo-luta.css">
  <link rel="stylesheet" href="akuma-no-mi.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

</head>

<body id="itens-page">

  <div class="background"></div>
  <div class="overlay"></div>

  <header class="navbar">

    <div class="logo-area">

      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo"
      >

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>

    </div>

    <nav>
      <a href="#" onclick="voltar()">VOLTAR</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <section class="guide-title">

    <h1>EFEITOS</h1>

    <p>
      Todos os efeitos disponíveis no Grand Line RPG.
    </p>

  </section>

  <main id="list"></main>

  <div id="modal" class="modal">

    <div class="modal-content">

      <button
        class="close-item-x"
        onclick="closeModal()"
      >
        ×
      </button>

      <h2 id="m-title"></h2>

      <img
        id="m-img"
        class="ficha-img"
      >

      <p id="m-desc"></p>

      <p id="m-desc"></p>

      <h3 id="m-func-title">
        FUNCIONAMENTO
      </h3>

      <p id="m-func"></p>

      <p id="m-extras"></p>

      <button id="editar-efeito-btn">
        EDITAR
      </button>

    </div>

  </div>

  <script type="module">

    import {
      initializeApp
    }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      get
    }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {

      apiKey:
      "AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",

      authDomain:
      "grand-line-rpg-dcda9.firebaseapp.com",

      projectId:
      "grand-line-rpg-dcda9",

      storageBucket:
      "grand-line-rpg-dcda9.appspot.com",

      messagingSenderId:
      "172042779786",

      appId:
      "1:172042779786:web:ecdff9eaf4fee36eca8173",

      databaseURL:
      "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"

    };

    const app =
      initializeApp(firebaseConfig);

    const db =
      getDatabase(app);

    const CLOUD =
      "https://res.cloudinary.com/djh45admn/image/upload/v1784283109/";
    
    const list =
      document.getElementById("list");

    async function loadEfeitos() {

      list.innerHTML = "";

      const snap =
        await get(ref(db, "efeitos"));

      if (!snap.exists()) return;

      const efeitos =
        Object.values(snap.val());

      efeitos.forEach(efeito => {

        const card =
          document.createElement("div");

        card.className = "item";

        card.innerHTML = `
          <div class="item-emoji">
            ${efeito.emoji || "✨"}
          </div>

          <span>${efeito.nome}</span>
        `;

        card.onclick =
          () => openModal(efeito);

        list.appendChild(card);

      });

    }

    loadEfeitos();

    function openModal(efeito) {

      document.getElementById("modal")
      .style.display = "flex";

      document.getElementById("m-title")
      .innerText =
      efeito.nome;

      document.getElementById("m-desc")
      .innerText =
      efeito.description || "";

      document.getElementById("m-img")
      .src =
      CLOUD + efeito.img + ".jpg";

    }

    window.closeModal = function () {

      document.getElementById("modal")
      .style.display = "none";

    }

    window.voltar = function () {

      history.back();

    }

  </script>

</body>

</html>
