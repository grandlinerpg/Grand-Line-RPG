<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facções - Grand Line RPG</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f1a;
      color: white;
    }

    header {
      text-align: center;
      padding: 30px 10px;
      font-size: 28px;
      font-weight: bold;
      background: #11182a;
      border-bottom: 2px solid #1f2a44;
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 40px 20px;
    }

    .card {
      width: 280px;
      background: #141c2f;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      transition: 0.3s;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card h2 {
      text-align: center;
      margin: 15px 0 5px;
    }

    .card p {
      text-align: center;
      padding: 0 10px 20px;
      font-size: 14px;
      color: #bbb;
    }

    .governo {
      border-top: 4px solid #2e6bff;
    }

    .revolucionario {
      border-top: 4px solid #ff3b3b;
    }

    .piratas {
      border-top: 4px solid #ffcc00;
    }

  </style>
</head>

<body>

  <header>
    Facções do Mundo
  </header>

  <div class="container">

    <!-- Governo Mundial -->
    <div class="card governo">
      <img src="https://i.imgur.com/5Kp0Q9q.png" alt="Governo Mundial">
      <h2>Governo Mundial</h2>
      <p>O poder supremo que controla os mares e impõe a ordem mundial.</p>
    </div>

    <!-- Revolucionários -->
    <div class="card revolucionario">
      <img src="https://i.imgur.com/9dXQx7a.png" alt="Exército Revolucionário">
      <h2>Exército Revolucionário</h2>
      <p>Grupo que luta contra o Governo Mundial pela liberdade dos povos.</p>
    </div>

    <!-- Piratas -->
    <div class="card piratas">
      <img src="https://i.imgur.com/1ZQZ1Zx.png" alt="Piratas">
      <h2>Piratas</h2>
      <p>Rebeldes dos mares em busca de liberdade, poder e o One Piece.</p>
    </div>

  </div>

</body>
</html>
