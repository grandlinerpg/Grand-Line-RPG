<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jogadores - Grand Line RPG</title>

  <link rel="stylesheet" href="jogadores.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <header class="navbar">

    <div class="logo-area">

      <img src="https://i.imgur.com/aBJrsQt.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>

    </div>

    <nav>
      <a href="index.html">INÍCIO</a>
      <a href="jogadores.html">JOGADORES</a>
    </nav>

  </header>

  <section class="players-title">

    <h1>JOGADORES</h1>

    <p>Lista oficial de jogadores do Grand Line RPG.</p>

  </section>

  <main id="players-container"></main>

  <!-- MODAL -->
  <div id="modal" class="modal">

    <div class="modal-box">

      <span class="close" onclick="closeModal()">×</span>

      <img id="modal-img" class="modal-img">

      <h2 id="modal-nome"></h2>

      <p id="modal-nivel"></p>
      <p id="modal-exp"></p>
      <p id="modal-dinheiro"></p>

    </div>

  </div>

  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      get
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4kgy_L79WYFQr9XZhoDuBfqG4AGTVUQ",
      authDomain: "grand-line-rpg-dcda9.firebaseapp.com",
      projectId: "grand-line-rpg-dcda9",
      storageBucket: "grand-line-rpg-dcda9.appspot.com",
      messagingSenderId: "172042779786",
      appId: "1:172042779786:web:ecdff9eaf4fee36eca8173",
      databaseURL: "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const container = document.getElementById("players-container");

    async function loadPlayers() {

      const snap = await get(ref(db, "players"));

      if (!snap.exists()) return;

      const data = snap.val();

      container.innerHTML = "";

      Object.values(data).forEach(player => {

        const card = document.createElement("div");
        card.classList.add("card");

        const nome = player.nome || "Desconhecido";
        const foto = player.foto || "";
        const nivel = player.info?.nivel || 1;
        const exp = player.info?.exp || 0;
        const dinheiro = player.info?.dinheiro || 0;

        card.innerHTML = `
          <img src="${foto}" class="character-img" alt="${nome}">
          <div class="info">
            <h2>${nome}</h2>
            <p>⭐ Nível: <span>${nivel}</span></p>
          </div>
        `;

        card.onclick = () => openModal(foto, nome, nivel, exp, dinheiro);

        container.appendChild(card);
      });
    }

    loadPlayers();

    // MODAL
    function openModal(img, nome, nivel, exp, dinheiro) {

      document.getElementById("modal").style.display = "flex";
      document.getElementById("modal-img").src = img;
      document.getElementById("modal-nome").innerText = nome;
      document.getElementById("modal-nivel").innerText = "⭐ Nível: " + nivel;
      document.getElementById("modal-exp").innerText = "⚡ EXP: " + exp;
      document.getElementById("modal-dinheiro").innerText = "💰 Saldo: " + dinheiro;

      document.body.classList.add("modal-open");
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
      document.body.classList.remove("modal-open");
    }

    window.openModal = openModal;
    window.closeModal = closeModal;

    window.onclick = function (event) {
      const modal = document.getElementById("modal");
      if (event.target === modal) closeModal();
    };

  </script>

</body>
</html>
