<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itens - Grand Line RPG</title>

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../guia.css">
<link rel="stylesheet" href="estilo-luta.css">
<link rel="stylesheet" href="../perfil/inventario.css">
<link rel="stylesheet" href="akuma-no-mi.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<header class="navbar">
  <div class="logo-area">
    <img src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png" class="logo">
    <div class="logo-text">
      <h1>GRAND LINE</h1>
      <p>— RPG —</p>
    </div>
  </div>

  <nav>
    <a href="#" onclick="voltar()">VOLTAR</a>
    <a href="guia.html">GUIA</a>
  </nav>
</header>

<section class="guide-title">
  <h1>ITENS</h1>
  <p>Todos os itens disponíveis no Grand Line RPG.</p>
</section>

<main id="list"></main>

<div id="modal" class="modal">
  <div class="modal-content">

    <button class="close-item-x" onclick="closeModal()">×</button>

    <img id="m-img" class="modal-img">

    <h2 id="m-title"></h2>

    <p id="m-desc"></p>

    <img id="m-tier-img" class="modal-tier-img">

    <button id="m-btn">FECHAR</button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",
authDomain:"grand-line-rpg-dcda9.firebaseapp.com",
projectId:"grand-line-rpg-dcda9",
storageBucket:"grand-line-rpg-dcda9.appspot.com",
messagingSenderId:"172042779786",
appId:"1:172042779786:web:ecdff9eaf4fee36eca8173",
databaseURL:"https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const CLOUD="https://res.cloudinary.com/djh45admn/image/upload/v1779847983/";

const tiersImg={
1:CLOUD+"tier-1.png",
2:CLOUD+"tier-2.png",
3:CLOUD+"tier-3.png",
4:CLOUD+"tier-4.png",
5:CLOUD+"tier-5.png",
6:CLOUD+"tier-6.png"
};

const list=document.getElementById("list");

async function loadItens(){

  list.innerHTML="";

  const snap=await get(ref(db,"itens"));

  if(!snap.exists()) return;

  const categorias=snap.val();

  Object.entries(categorias).forEach(([categoria,itens])=>{

    if(categoria.toLowerCase()==="akuma no mi") return;

    Object.values(itens).forEach(item=>{

      if(Number(item.tipo)===2) return;

      const card=document.createElement("div");
      card.className="item";
      card.innerHTML=`
        ${
          item.img
            ? `<img src="${CLOUD + item.img}.png">`
            : `<div class="item-emoji">${item.item || "📦"}</div>`
        }
        <span>${item.nome}</span>
      `;

      card.onclick=()=>openModal(item);

      list.appendChild(card);

    });

  });

}

loadItens();

function openModal(item){

  document.getElementById("modal").style.display="flex";
  document.getElementById("m-title").innerText=item.nome;
  document.getElementById("m-desc").innerText=item.description||"";
  document.getElementById("m-tier-img").src=tiersImg[item.tier]||"";
  document.getElementById("m-img").src=CLOUD+item.img+".png";

}

window.closeModal=function(){
 document.getElementById("modal").style.display="none";
}

document.getElementById("m-btn").onclick=closeModal;

window.voltar=function(){
 history.back();
}
</script>

</body>
</html>
