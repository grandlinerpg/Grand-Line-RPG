<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grand Line RPG</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">
      <img src="https://i.imgur.com/aBJrsQt.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <nav>
      <a href="index.html">INÍCIO</a>
      <a href="jogadores.html">JOGADORES</a>
      <a href="faccoes.html">FACÇÕES</a>
      <a href="mapa.html">MAPA</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <!-- HERO -->
  <main class="hero">

    <img src="https://i.imgur.com/DYQY9IR.png" class="main-logo">

    <p>
      VIVA SUA PRÓPRIA AVENTURA NO NOVO MUNDO!<br>
      TORNE-SE LENDÁRIO. NAVEGUE. LUTE. CONQUISTE.
    </p>

    <!-- BOTÃO DINÂMICO -->
    <div id="home-button-area">
      <button class="button-loading">CARREGANDO...</button>
    </div>

  </main>

  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_AUTH_DOMAIN",
      projectId: "SEU_PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const area = document.getElementById("home-button-area");

    async function init() {

      // 🔥 garante login salvo
      await setPersistence(auth, browserLocalPersistence);

      onAuthStateChanged(auth, (user) => {

        if (user) {

          area.innerHTML = `
            <a href="perfil.html" class="hero-btn">
              👤 MEU PERFIL
            </a>
          `;

        } else {

          area.innerHTML = `
            <a href="auth.html" class="hero-btn">
              ⚓ COMEÇAR JORNADA
            </a>
          `;

        }

      });

    }

    init();

  </script>

</body>
</html>
