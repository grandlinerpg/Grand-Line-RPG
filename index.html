<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Line RPG</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Fundo -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- Navbar -->
  <header class="navbar">

    <div class="logo-area">
      <img
        src="https://i.imgur.com/DYQY9IR.png"
        class="logo"
      >

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>RPG</p>
      </div>
    </div>

    <nav>
      <a href="">INÍCIO</a>
      <a href="">RANKING</a>
      <a href="">MAPA</a>
      <a href="">FACÇÕES</a>
      <a href="">GUIA</a>
    </nav>

  </header>

  <!-- Conteúdo -->
  <main class="hero">

    <img
      src="https://i.imgur.com/DYQY9IR.png"
      class="main-logo"
    >

    <p>
      Viva sua própria aventura no Novo Mundo.
      Recrute sua tripulação, enfrente inimigos
      lendários e torne-se o Rei dos Piratas.
    </p>

    <button>
      ⚓ COMEÇAR JORNADA
    </button>

  </main>

  <script src="script.js"></script>

</body>
</html>
