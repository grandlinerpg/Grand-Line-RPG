<div id="market-skills-modal" class="skills-modal">

  <div class="skills-window">

    <button
      id="close-market-skills"
      class="close-skills"
    >
      ×
    </button>

    <div class="skills-header">
      <h2>APRENDER</h2>
    </div>

    <div class="skills-filter">

      <select id="market-skills-category">
        <option value="all">
          Todas Categorias
        </option>
      </select>

    </div>

    <div
      id="market-skills-list"
      class="skills-list"
    >
    </div>

  </div>

</div>

<div id="confirm-skill-modal" class="item-modal">

  <div class="item-window">

    <div class="item-top">

      <div class="item-info">
        <h2 id="confirm-skill-title">TEM CERTEZA?</h2>
      </div>

      <p style="color:#ddd; text-align:center;">
        Você realmente deseja aprender essa habilidade?
      </p>

    </div>

    <div class="item-actions">

      <button id="confirm-skill-yes">SIM</button>
      <button id="confirm-skill-no">NÃO</button>

    </div>

  </div>

</div>
