  <section class="guide-title">

    <h1>EFEITOS</h1>

    <p>
      Todos os efeitos disponíveis no Grand Line RPG.
    </p>

  </section>

  <main id="list"></main>

  <div id="efeito-container"></div>

  <script type="module">

    import {
      initializeApp
    }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      get
    }

    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {

      apiKey:
      "AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",

      authDomain:
      "grand-line-rpg-dcda9.firebaseapp.com",

      projectId:
      "grand-line-rpg-dcda9",

      storageBucket:
      "grand-line-rpg-dcda9.appspot.com",

      messagingSenderId:
      "172042779786",

      appId:
      "1:172042779786:web:ecdff9eaf4fee36eca8173",

      databaseURL:
      "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"

    };

    const app =
      initializeApp(firebaseConfig);

    const db =
      getDatabase(app);
    
    const list =
      document.getElementById("list");

    async function loadEfeitos() {

      list.innerHTML = "";

      const snap =
        await get(ref(db, "efeitos"));

      if (!snap.exists()) return;

      const efeitos =
      Object.entries(snap.val()).map(([id, efeito])=>{
           return {
              id:id,
              ...efeito
          };
  
       });

      efeitos.forEach(efeito => {

        const card =
          document.createElement("div");

        card.className = "item";

        card.innerHTML = `
          <div class="item-emoji">
            ${efeito.emoji || "✨"}
          </div>

          <span>${efeito.nome}</span>
        `;

        card.onclick =
          () => abrirEfeito(efeito.id);

        list.appendChild(card);

      });

    }

    loadEfeitos();


    window.voltar = function () {

      history.back();

    }

  </script>

  <script type="module" src="efeito.js"></script>
  <script type="module" src="efeito-edit.js"></script>
