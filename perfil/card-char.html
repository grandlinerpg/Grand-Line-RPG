<div id="personagem-modal" class="personagem-modal">

  <div class="personagem-window">

    <button id="close-personagem" class="close-personagem">
      ×
    </button>

    <div class="personagem-image-area">

      <img
        id="personagem-img"
        class="personagem-img"
        src="default-personagem.png">

      <!-- NOME -->
      <h2 id="personagem-nome" class="personagem-nome">
        -
      </h2>

      <div class="personagem-bottom">

        <!-- ATRIBUTOS -->
        <div class="personagem-atributos">

          <div id="personagem-for">
            FOR -
          </div>

          <div id="personagem-res">
            RES -
          </div>

          <div id="personagem-dex">
            DEX -
          </div>

          <div id="personagem-agi">
            AGI -
          </div>

          <div id="personagem-stm">
            STM -
          </div>

        </div>

        <!-- RANK -->
        <div
          id="personagem-rank"
          class="personagem-rank">
          -
        </div>

      </div>

    </div>

    <label class="upload-personagem">

      UPLOAD

      <input
        type="file"
        id="upload-img"
        accept="image/*"
        hidden>

    </label>

    <button
      id="download-personagem"
      class="download-personagem">

      DOWNLOAD

    </button>

  </div>

</div>
