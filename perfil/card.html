<div id="card-modal" class="card-modal">

  <div class="card-window">

    <button id="close-card" class="close-card">
      ×
    </button>

    <div class="card-image-area">

      <img id="card-img" class="card-img">

      <h2 id="card-nome" class="card-nome">
        -
      </h2>

      <div class="card-bottom">

        <div class="card-atributos">

          <div id="card-atk">ATK: -</div>

          <div id="card-def">DEF: -</div>

          <div id="card-stm">STM: -</div>

          <div id="card-pow">POW: -</div>

        </div>

        <div id="card-rank" class="card-rank">
          -
        </div>

      </div>

    </div>

    <div class="card-editor">

    <div class="editor-row">

    <label>Posição</label>

    <select id="posicao-card">

        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>

    </select>

</div>

      <div class="editor-row">

        <label>Nome</label>

        <select id="fonte-nome">

            <option value="Mishaland">Mishaland</option>
            <option value="Dopestyle">Dopestyle</option>
            <option value="Eclipse Demo">Eclipse</option>
            <option value="Martyric_PersonalUse">Matyric</option>

        </select>

        <div class="color-wrapper">

            <button
                class="color-picker"
                data-target="nome">
            </button>

            <div class="color-menu">

                <button data-color="#000000"></button>
                <button data-color="#ffffff"></button>
                <button data-color="#d4af37"></button>
                <button data-color="#c0c0c0"></button>
                <button data-color="#ff0000"></button>
                <button data-color="#0066ff"></button>
                <button data-color="#00aa44"></button>

            </div>

        </div>

    </div>

    <div class="editor-row">

        <label>Atributo</label>

        <select id="fonte-atributo">

            <option value="Radiant">Radiant</option>
            <option value="Headlight">Headlight</option>
            <option value="Feelin Sweet">Feelin Sweet</option>
            <option value="Pink Blue">Pink Blue</option>
    

        </select>

        <div class="color-wrapper">

            <button
                class="color-picker"
                data-target="atributo">
            </button>

            <div class="color-menu">

                <button data-color="#000000"></button>
                <button data-color="#ffffff"></button>
                <button data-color="#d4af37"></button>
                <button data-color="#c0c0c0"></button>
                <button data-color="#ff0000"></button>
                <button data-color="#0066ff"></button>
                <button data-color="#00aa44"></button>

            </div>

        </div>

    </div>

</div>


    <button id="download-card" class="download-card">
      BAIXAR
    </button>


  </div>

</div>
