```html
<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Grand Line RPG - Login</title>

  <link rel="stylesheet" href="auth.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- CONTAINER -->
  <main class="auth-container">

    <!-- LOGIN -->
    <div
      class="auth-card"
      id="login-box"
    >

      <img
        src="https://i.imgur.com/aBJrsQt.png"
        class="logo"
      >

      <h1>GRAND LINE RPG</h1>

      <p>
        Entre na sua conta para continuar sua jornada.
      </p>

      <form onsubmit="event.preventDefault()">

        <div class="input-group">

          <label>Email</label>

          <input
            type="email"
            id="login-email"
            placeholder="Digite seu email"
          >

        </div>

        <div class="input-group">

          <label>Senha</label>

          <input
            type="password"
            id="login-password"
            placeholder="Digite sua senha"
          >

        </div>

        <button
          type="button"
          onclick="login()"
        >
          ENTRAR
        </button>

      </form>

      <div class="switch-page">

        <span>Não possui conta?</span>

        <button
          class="switch-btn"
          onclick="showRegister()"
        >
          REGISTRAR
        </button>

      </div>

    </div>

    <!-- REGISTRO -->
    <div
      class="auth-card hidden"
      id="register-box"
    >

      <img
        src="https://i.imgur.com/aBJrsQt.png"
        class="logo"
      >

      <h1>CRIAR CONTA</h1>

      <p>
        Registre-se para começar sua aventura.
      </p>

      <form onsubmit="event.preventDefault()">

        <div class="input-group">

          <label>Nome</label>

          <input
            type="text"
            id="register-name"
            placeholder="Digite seu nome"
          >

        </div>

        <div class="input-group">

          <label>Email</label>

          <input
            type="email"
            id="register-email"
            placeholder="Digite seu email"
          >

        </div>

        <div class="input-group">

          <label>Senha</label>

          <input
            type="password"
            id="register-password"
            placeholder="Digite sua senha"
          >

        </div>

        <div class="input-group">

          <label>Confirmar Senha</label>

          <input
            type="password"
            id="register-confirm"
            placeholder="Confirme sua senha"
          >

        </div>

        <button
          type="button"
          onclick="register()"
        >
          REGISTRAR
        </button>

      </form>

      <div class="switch-page">

        <span>Já possui conta?</span>

        <button
          class="switch-btn"
          onclick="showLogin()"
        >
          LOGIN
        </button>

      </div>

    </div>

  </main>

  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /* FIREBASE CONFIG */

    const firebaseConfig = {

      apiKey:
        "AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",

      authDomain:
        "grand-line-rpg-dcda9.firebaseapp.com",

      projectId:
        "grand-line-rpg-dcda9",

      storageBucket:
        "grand-line-rpg-dcda9.firebasestorage.app",

      messagingSenderId:
        "172042779786",

      appId:
        "1:172042779786:web:ecdff9eaf4fee36eca8173",

      measurementId:
        "G-1H48YJSFXQ"
    };

    /* INICIAR FIREBASE */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    /* MOSTRAR REGISTRO */

    window.showRegister = function(){

      document
        .getElementById("login-box")
        .classList.add("hidden");

      document
        .getElementById("register-box")
        .classList.remove("hidden");
    }

    /* MOSTRAR LOGIN */

    window.showLogin = function(){

      document
        .getElementById("register-box")
        .classList.add("hidden");

      document
        .getElementById("login-box")
        .classList.remove("hidden");
    }

    /* REGISTRAR */

    window.register = function(){

      const password =
        document.getElementById(
          "register-password"
        ).value;

      const confirm =
        document.getElementById(
          "register-confirm"
        ).value;

      if(password !== confirm){

        alert("As senhas não coincidem.");

        return;
      }

      const email =
        document.getElementById(
          "register-email"
        ).value;

      createUserWithEmailAndPassword(
        auth,
        email,
        password
      )

      .then(() => {

        alert("Conta criada com sucesso!");

        showLogin();

      })

      .catch((error) => {

        alert(error.message);

      });
    }

    /* LOGIN */

    window.login = function(){

      const email =
        document.getElementById(
          "login-email"
        ).value;

      const password =
        document.getElementById(
          "login-password"
        ).value;

      signInWithEmailAndPassword(
        auth,
        email,
        password
      )

      .then(() => {

        alert("Login realizado!");

        window.location.href =
          "index.html";

      })

      .catch((error) => {

        alert(error.message);

      });
    }

  </script>

</body>
</html>
```
