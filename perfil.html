<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perfil - Grand Line RPG</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="perfil.css">
  <link rel="stylesheet" href="perfil/distribuir.css">
  <link rel="stylesheet" href="perfil/inventario.css">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">
      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo"
      >

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <!-- BOTÃO MENU -->
    <button
      class="menu-toggle"
      id="menu-toggle"
      aria-label="Abrir Menu"
    >
      ☰
    </button>

    <!-- MENU -->
    <nav id="nav-menu">

      <a href="index.html">INÍCIO</a>

      <a href="faccoes.html">FACÇÕES</a>

      <a href="jogadores.html">JOGADORES</a>

      <a href="mapa.html">MAPA</a>

      <a href="guia.html">GUIA</a>

    </nav>
    
  </header>

  <!-- PERFIL -->
  <main class="profile-container">

    <div class="profile-card">

      <!-- PERSONAGEM -->
      <div class="profile-header">

        <div class="char-image">
          <img id="char-img" src="https://res.cloudinary.com/djh45admn/image/upload/v1778661201/sem-personagem.png">
        </div>

        <div class="char-info">
          <p><b>Jogador:</b> <span id="player-name">—</span></p>
          <p><b>Personagem:</b> <span id="char-name">—</span></p>
          <p><b>Facção:</b> <span id="faction">—</span></p>
        </div>

        <!-- LEVEL -->
        <div class="level-badge">
          <img src="https://res.cloudinary.com/djh45admn/image/upload/v1778336779/nivelglrpg.png" alt="level">
          <span id="level">1</span>
        </div>

      </div>

      <!-- SALDO + EXP -->
      <div class="top-stats">

        <div class="stat-box">
          💰 SALDO<br>
          ฿ <span id="saldo">0</span>
        </div>

        <div class="stat-box">
          ⚡ EXP<br>
          <span id="exp">0</span> / <span id="exp-max">1000</span>
        </div>

      </div>

      <hr>

      <!-- INFORMAÇÕES -->
      <h2 class="title-center">INFORMAÇÕES</h2>

      <div class="profile-grid">

        <div><b>Estilo de Luta:</b> <span id="style">—</span></div>
        <div><b>Raça ou Tribo:</b> <span id="race">—</span></div>
        <div><b>Akuma no Mi:</b> <span id="fruit">—</span></div>

      </div>

      <hr>

      <!-- ATRIBUTOS -->
      <h2 class="title-center">ATRIBUTOS</h2>

      <div class="stats">
        <div>💪 Força: <span id="str">0</span></div>
        <div>🛡️ Resistência: <span id="res">0</span></div>
        <div>🎯 Destreza: <span id="dex">0</span></div>
        <div>⚡ Agilidade: <span id="agi">0</span></div>
        <div>🔥 Stamina: <span id="sta">0</span></div>
        <div>❤️ Vida: <span id="hp">0</span></div>
      </div>

      <button class="glrpg-button" id="open-inventory">
        INVENTÁRIO
      </button>
      
      <button class="glrpg-button" id="open-points">
        DISTRIBUIR PONTOS
      </button>

      <button class="glrpg-button" id="open-skills">
        VER HABILIDADES
      </button>

      <button class="glrpg-button" onclick="logout()">
        SAIR DA CONTA
      </button>

    </div>

  </main>

  <!-- 🔥 CORREÇÃO IMPORTANTE -->
  <!-- antes os dois lutavam pelo mesmo container sem controle -->
  <div id="inventory-container"></div>
  <div id="distribuir-container"></div>

  <!-- FIREBASE SCRIPT -->
  <script type="module" src="perfil.js"></script>
  
  <!-- ITEM SYSTEM -->
  <script type="module" src="perfil/item.js"></script>

  <!-- ⚠️ ordem corrigida (evita sobrescrever DOM no mesmo instante) -->
  <script type="module" src="perfil/inventario.js"></script>
  <script type="module" src="perfil/distribuir.js"></script>

  <!-- MENU MOBILE -->
  <script>

    const menuToggle = document.getElementById("menu-toggle");
    const navMenu = document.getElementById("nav-menu");

    menuToggle.addEventListener("click", () => {

      navMenu.classList.toggle("active");

    });

  </script>
  
</body>
</html>
