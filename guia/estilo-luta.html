<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estilos de Luta - Grand Line RPG</title>

  <link rel="stylesheet" href="estilo-luta.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR (SEM ALTERAÇÃO) -->
  <header class="navbar">

    <div class="logo-area">
      <img src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png" class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>
    </div>

    <nav>
      <a href="#" onclick="voltar()">VOLTAR</a>
      <a href="guia.html">GUIA</a>
    </nav>

  </header>

  <section class="guide-title">
    <h1>ESTILOS DE LUTA</h1>
    <p>Escolha seu estilo de combate</p>
  </section>

  <main id="list"></main>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content">

      <img id="m-img" class="modal-img">

      <h2 id="m-title"></h2>
      <p id="m-tier-text"></p>
      <img id="m-tier-img" class="modal-tier-img">
      <p id="m-desc"></p>

      <button id="m-btn">VER HABILIDADES</button>
      <button onclick="closeModal()">FECHAR</button>

    </div>
  </div>

  <script>

    const tiersImg = {
      1: "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-1.png",
      2: "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-2.png",
      3: "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-3.png",
      4: "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-4.png",
      5: "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/tier-5.png"
    };

    const styles = [
      { n:"Arte do Clima", t:4, d:"Manipula o clima com o Clima-Tact", l:"arte-do-clima.html" },
      { n:"Atirador", t:3, d:"Armas de longo alcance", l:"atirador.html" },
      { n:"Black Leg", t:3, d:"Chutes poderosos", l:"black-leg.html" },
      { n:"Boxeador", t:2, d:"Punhos e força bruta", l:"boxeador.html" },
      { n:"Ciborgue", t:4, d:"Tecnologia e armas mecânicas", l:"ciborgue.html" },
      { n:"Circense", t:2, d:"Acrobacias e lâminas", l:"circense.html" },
      { n:"Espadachim", t:5, d:"Mestre das espadas", l:"espadachim.html" },
      { n:"Hashoken", t:4, d:"Ondas de choque", l:"hashoken.html" },
      { n:"Hipnotizador", t:3, d:"Controle mental", l:"hipnotizador.html" },
      { n:"Jao Kun Do", t:3, d:"Chutes rápidos", l:"jao-kun-do.html" },
      { n:"Jio-Ken", t:2, d:"Golpes brutais", l:"jio-ken.html" },
      { n:"Lanceiro", t:3, d:"Armas de longo alcance", l:"lanceiro.html" },
      { n:"Ninjutsu", t:4, d:"Furtividade extrema", l:"ninjutsu.html" },
      { n:"Okama Kenpo", t:2, d:"Dança de combate", l:"okama-kenpo.html" },
      { n:"Punho de Ferro", t:4, d:"Força máxima", l:"punho-de-ferro.html" },
      { n:"Rokushiki", t:5, d:"Técnicas da Marinha", l:"rokushiki.html" },
      { n:"Ryusoken", t:4, d:"Garras de dragão", l:"ryusoken.html" },
      { n:"Shuron Hakke", t:3, d:"Luta bêbada", l:"shuron-hakke.html" },
      { n:"Yamagurai", t:3, d:"Machados pesados", l:"yamagurai.html" }
    ];

    const list = document.getElementById("list");

    function slug(name){
      return name.toLowerCase().replace(/ /g,'-');
    }

    /* ALTERAÇÃO SÓ AQUI */
    for(let t=1;t<=5;t++){

      const sep = document.createElement("div");
      sep.className = "tier-sep";
      sep.innerHTML = `<img src="${tiersImg[t]}">`;
      list.appendChild(sep);

      styles.filter(s => s.t === t).forEach(s => {

        const item = document.createElement("div");
        item.className = "item";

        item.innerHTML = `
          <img src="https://res.cloudinary.com/djh45admn/image/upload/v1779847983/${slug(s.n)}.png">
          <span>${s.n}</span>
        `;

        item.onclick = () => openModal(s);

        list.appendChild(item);
      });
    }

    function openModal(s){
      document.getElementById("modal").style.display = "flex";
      document.getElementById("m-title").innerText = s.n;
      document.getElementById("m-tier-img").src = tiersImg[s.t];
      document.getElementById("m-desc").innerText = s.d;
      document.getElementById("m-img").src =
        "https://res.cloudinary.com/djh45admn/image/upload/v1779847983/" + slug(s.n) + ".png";

      document.getElementById("m-btn").onclick = () => {
        window.location.href = s.l;
      };
    }

    function closeModal(){
      document.getElementById("modal").style.display = "none";
    }

    function voltar(){
      history.back();
    }

  </script>

</body>
</html>
