<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jogadores - Grand Line RPG</title>

  <link rel="stylesheet" href="jogadores.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- FUNDO -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo-area">

      <img
        src="https://i.imgur.com/aBJrsQt.png"
        class="logo"
      >

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>- RPG -</p>
      </div>

    </div>

    <nav>
      <a href="index.html">INÍCIO</a>
      <a href="jogadores.html">JOGADORES</a>
    </nav>

  </header>

  <!-- TÍTULO -->
  <section class="players-title">

    <h1>JOGADORES</h1>

    <p>
      Lista oficial de jogadores do Grand Line RPG.
    </p>

  </section>

  <!-- PLAYERS -->
  <main id="players-container"></main>

  <script>

    const sheetURL =
      "https://opensheet.elk.sh/1-JMYZlXQ9bi4MftELWt13k9F3LpufVZ46I4c17Fnk_I/teste";

    fetch(sheetURL)
      .then(res => res.json())
      .then(data => {

        const container =
          document.getElementById("players-container");

        data.forEach(player => {

          container.innerHTML += `

            <div class="card">

              <img
                src="${player.foto}"
                class="character-img"
              >

              <div class="info">

                <h2>${player.nome}</h2>

                <p>⭐ Nível: ${player.nivel}</p>

                <p>⚡ EXP: ${player.exp}</p>

                <p>💰 Dinheiro: ${player.dinheiro}</p>

              </div>

            </div>

          `;

        });

      });

  </script>

</body>
</html>
