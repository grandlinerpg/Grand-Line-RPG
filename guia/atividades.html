  <style>
    /* Redução dos espaçamentos gigantes do topo */
    .guide-title {
      padding-bottom: 10px !important;
      margin-bottom: 10px !important;
    }

    .top-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    #list {
      margin-top: 10px !important;
      padding-top: 0 !important;
    }

    .top-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #c8a355;
      color: #c8a355;
      padding: 8px 20px;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .top-btn:hover, .top-btn.active {
      background: #c8a355;
      color: #000;
      box-shadow: 0 0 10px rgba(200, 163, 85, 0.5);
    }

    /* Ocultar Recompensas quando for Geral (Ativas / Passivas) */
    body.hide-rewards .recompensas-box,
    body.hide-rewards .atividade-recompensas,
    body.hide-rewards [class*="recompensa"],
    body.hide-rewards [class*="exp"],
    body.hide-rewards [class*="berries"] {
      display: none !important;
    }
  </style>

</head>

<body id="atividades-page">

  <div class="background"></div>
  <div class="overlay"></div>

  <header class="navbar">

    <div class="logo-area">

      <img
        src="https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png"
        class="logo">

      <div class="logo-text">
        <h1>GRAND LINE</h1>
        <p>— RPG —</p>
      </div>

    </div>

    <nav>

      <a href="../index.html">INÍCIO</a>

      <a href="../faccao.html">FACÇÃO</a>

      <a href="../mapa.html">MAPA</a>

      <a href="../guia.html">GUIA</a>

    </nav>

  </header>

  <section class="guide-title">

    <h1>ATIVIDADES</h1>

    <p>
      Todas as atividades disponíveis no Grand Line RPG.
    </p>

    <!-- Botões no topo -->
    <div class="top-buttons">
      <button class="top-btn" id="btn-ativas">ATIVAS</button>
      <button class="top-btn" id="btn-passivas">PASSIVAS</button>
      <button class="top-btn" id="btn-jogadores">JOGADORES</button>
    </div>

  </section>

  <main id="list"></main>

  <div id="atividade-container"></div>
  <div id="atividade-edit-container"></div>
  
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      get
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {

      apiKey: "AIzaSyC4kgy_L79WYFqr9XZhoDuZBfqG4AGTVUQ",
      authDomain: "grand-line-rpg-dcda9.firebaseapp.com",
      projectId: "grand-line-rpg-dcda9",
      storageBucket: "grand-line-rpg-dcda9.appspot.com",
      messagingSenderId: "172042779786",
      appId: "1:172042779786:web:ecdff9eaf4fee36eca8173",
      databaseURL: "https://grand-line-rpg-dcda9-default-rtdb.firebaseio.com"

    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const list = document.getElementById("list");

    // Mapeamento de logos de facções (adicione ou edite os links conforme suas imagens)
    const LOGOS_FACCOES = {
      "Governo Mundial": "https://res.cloudinary.com/djh45admn/image/upload/v1778336777/governo_mundial.png",
      "Marinha": "https://res.cloudinary.com/djh45admn/image/upload/v1778336777/marinha.png",
      "Pirata": "https://res.cloudinary.com/djh45admn/image/upload/v1778336777/pirata.png",
      "Exército Revolucionário": "https://res.cloudinary.com/djh45admn/image/upload/v1778336777/revolucionario.png"
    };

    const LOGO_PADRAO = "https://res.cloudinary.com/djh45admn/image/upload/v1778336777/logoglrpg.png";

    async function loadAtividades(){

      list.innerHTML = "";

      const snap = await get(ref(db, "faccoes"));

      if(!snap.exists()) return;

      const faccoes = snap.val();

      const btnAtivas = document.getElementById("btn-ativas");
      const btnPassivas = document.getElementById("btn-passivas");
      const btnJogadores = document.getElementById("btn-jogadores");

      // Função auxiliar para abrir atividade sem recompensas
      const abrirSemRecompensas = (atividadeId) => {
        document.body.classList.add("hide-rewards");
        if (typeof window.abrirAtividade === "function") {
          window.abrirAtividade(atividadeId, "Gerais");
        }
      };

      if (btnAtivas) {
        btnAtivas.onclick = () => abrirSemRecompensas("ativas");
      }

      if (btnPassivas) {
        btnPassivas.onclick = () => abrirSemRecompensas("passivas");
      }

      if (btnJogadores) {
        btnJogadores.onclick = () => carregarJogadoresPorIlha();
      }

      Object.entries(faccoes).forEach(([id,faccao])=>{

        if (id === "Gerais") return;

        const titulo = document.createElement("div");
        titulo.className = "skill-rank";
        titulo.innerText = faccao.nome || id;

        list.appendChild(titulo);

        if(!faccao.atividades) return;

        Object.entries(faccao.atividades).forEach(([atividadeId,atividade])=>{

          const card = document.createElement("div");
          card.className = "item";

          card.innerHTML = `
            <div class="item-emoji">
              ${atividade.emoji || "📋"}
            </div>

            <span>
              ${atividade.nome}
            </span>
          `;

          card.onclick = ()=>{
            // Para as atividades normais, garante que as recompensas sejam visíveis
            document.body.classList.remove("hide-rewards");

            console.log({
              faccao:id,
              id:atividadeId,
              atividade
            });

            abrirAtividade(
              atividadeId,
              id
            );
          };

          list.appendChild(card);

        });

      });

    }

    // Função para carregar a aba de Jogadores nas Ilhas
    async function carregarJogadoresPorIlha() {
      list.innerHTML = "<p class='loading-txt'>Carregando presença nas ilhas...</p>";

      try {
        const snap = await get(ref(db, "players"));
        if (!snap.exists()) {
          list.innerHTML = "<p class='empty-txt'>Nenhum jogador encontrado.</p>";
          return;
        }

        const players = snap.val();
        const ilhasAgrupadas = {};

        // Agrupamento dos jogadores por Ilha e Facção
        Object.values(players).forEach(player => {
          const ilha = Number(player.character?.ilha ?? player.ilha ?? 0);
          
          // Ignora jogadores na ilha 0
          if (ilha === 0) return;

          const faccao = player.character?.faction || player.faction || "Sem Facção";
          const nivel = Number(player.info?.level || player.level || 1);

          if (!ilhasAgrupadas[ilha]) {
            ilhasAgrupadas[ilha] = {};
          }

          if (!ilhasAgrupadas[ilha][faccao]) {
            ilhasAgrupadas[ilha][faccao] = {
              forcaTotal: 0,
              qtdJogadores: 0
            };
          }

          ilhasAgrupadas[ilha][faccao].forcaTotal += nivel;
          ilhasAgrupadas[ilha][faccao].qtdJogadores += 1;
        });

        const ilhasOrdenadas = Object.keys(ilhasAgrupadas).sort((a, b) => Number(a) - Number(b));

        if (ilhasOrdenadas.length === 0) {
          list.innerHTML = "<p class='empty-txt'>Nenhuma ilha ocupada no momento (todos na ilha 0).</p>";
          return;
        }

        const containerIlhas = document.createElement("div");
        containerIlhas.className = "ilhas-grid";

        ilhasOrdenadas.forEach(numIlha => {
          const cardIlha = document.createElement("div");
          cardIlha.className = "card-ilha";

          let HTMLFaccoes = "";

          Object.entries(ilhasAgrupadas[numIlha]).forEach(([nomeFaccao, dados]) => {
            const logoUrl = LOGOS_FACCOES[nomeFaccao] || LOGO_PADRAO;

            HTMLFaccoes += `
              <div class="faccao-item">
                <img src="${logoUrl}" alt="${nomeFaccao}" class="faccao-logo" onerror="this.src='${LOGO_PADRAO}'">
                <div class="faccao-detalhes">
                  <span class="faccao-nome">${nomeFaccao}</span>
                  <span class="faccao-forca">⚡ Força: <strong>${dados.forcaTotal}</strong> (${dados.qtdJogadores} ${dados.qtdJogadores === 1 ? 'membro' : 'membros'})</span>
                </div>
              </div>
            `;
          });

          cardIlha.innerHTML = `
            <div class="ilha-header">
              <h3>ILHA #${numIlha}</h3>
            </div>
            <div class="ilha-corpo">
              ${HTMLFaccoes}
            </div>
          `;

          containerIlhas.appendChild(cardIlha);
        });

        list.innerHTML = "";
        list.appendChild(containerIlhas);

      } catch (err) {
        console.error("Erro ao carregar presença de jogadores:", err);
        list.innerHTML = "<p class='error-txt'>Erro ao carregar dados dos jogadores.</p>";
      }
    }

    loadAtividades();

  </script>

  <script type="module" src="../permissao.js"></script>
  <script type="module" src="atividade.js"></script>
  <script type="module" src="atividade-edit.js"></script>
  
</body>

</html>
