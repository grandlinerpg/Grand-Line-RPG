    const list = document.getElementById("list");

    /* CARREGAR AKUMA NO MI */

    async function loadAkumas(){

      const snap = await get(
        ref(db, "itens/akuma no mi")
      );

      if(!snap.exists()) return;

      const data = snap.val();

      for(let t = 1; t <= 5; t++){

        /* SEPARADOR */

        const sep = document.createElement("div");

        sep.className = "tier-sep";

        sep.innerHTML =
          `<img src="${tiersImg[t]}">`;

        list.appendChild(sep);

        /* ITENS */

        Object.values(data)

        .filter(a => Number(a.tier) === t)

        .forEach(a => {

          const item = document.createElement("div");

          item.className = "item";

          item.innerHTML = `

            <img src="${CLOUD + a.img}.png">

            <span>${a.nome}</span>

          `;

          item.onclick = () => openModal(a);

          list.appendChild(item);

        });

      }

    }

    loadAkumas();

    /* MODAL */

    function openModal(a){

      document.getElementById("modal")
      .style.display = "flex";

      document.getElementById("m-title")
      .innerText = a.nome;

      document.getElementById("m-desc")
      .innerText = a.description;

      document.getElementById("m-tier-img")
      .src = tiersImg[a.tier];

      document.getElementById("m-img")
      .src = CLOUD + a.img + ".png";

    }
